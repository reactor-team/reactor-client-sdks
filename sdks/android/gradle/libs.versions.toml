# Every Maven artifact this build pins, in one place.
#
# Toolchains are *not* here — the JDK, Gradle, CMake, Ninja and the Android command-line tools
# live in the repository-root mise.toml, and the SDK components sdkmanager installs live in
# ../sdk-packages.txt. This file is for things resolved from google() and mavenCentral().
#
# buildSrc reads this same file (see buildSrc/settings.gradle.kts), so the plugin classpath and
# the modules cannot drift onto different versions of AGP or Kotlin.

[versions]
# AGP 9.x is the Gradle-9 generation. The cancelled Kotlin SDK stack pinned 8.9.2 against a Gradle
# wrapper of its own; this repository pins Gradle 9.7.1 in mise.toml, and 8.9 does not run on it.
agp = "9.4.1"
# Gradle's embedded Kotlin, not AGP's declared one, and that is the whole subtlety.
#
# From AGP 9.0 the Android plugin owns Kotlin — applying `org.jetbrains.kotlin.android` beside it
# is a hard error — and AGP 9.4.1 *declares* kotlin 2.2.10. But buildSrc applies `kotlin-dsl`,
# which pins Gradle 9.7.1's embedded Kotlin (2.4.0), and that stdlib is what reaches a module's
# Kotlin compile. A 2.2 compiler cannot read 2.4 metadata, so the build fails on `kotlin.Unit`
# with "compiled with an incompatible version of Kotlin" while `dependencies` still reports
# kotlin-stdlib 2.2.10 — the classpath Gradle prints is not the classpath the compiler gets.
#
# So this tracks the Gradle version, not the AGP version: bumping Gradle in the root mise.toml
# may require bumping this line with it.
#
# This is also why sdks/java/buildSrc's comment about keeping its kotlin-gradle-plugin in
# lockstep with the Android SDK no longer holds — the desktop build picks its Kotlin, and this
# one follows Gradle's.
kotlin = "2.4.0"
spotless = "8.10.2"
ktlint = "1.5.0"
junit = "4.13.2"
coroutines = "1.10.2"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"

[libraries]
# Referenced from buildSrc to build the plugin classpath, which cannot use plugin markers.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

junit = { module = "junit:junit", version.ref = "junit" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
