org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Gradle never fetches a JDK on its own: mise owns the local toolchain and
# actions/setup-java owns CI's. A missing JDK is a loud failure, not a silent
# download that disagrees with mise.lock. Same reasoning as sdks/java.
org.gradle.java.installations.auto-download=false

# The Maven coordinates these artifacts publish under, and the version that rides into the AAR as
# its own version — which is what the client will report to the coordinator as
# client_info.sdk_version once A05 wires it through. This line is the release switch: bumping it
# and merging to main is what publishes, and release-android.yml will refuse the release unless
# CHANGELOG.md has a matching `## [x.y.z]` heading. A `-SNAPSHOT` suffix publishes nothing.
group=inc.reactor
version=0.1.0-SNAPSHOT

android.useAndroidX=true
kotlin.code.style=official
