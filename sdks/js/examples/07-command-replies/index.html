<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>07 — Command Replies · Reactor JS SDK</title>
    <style>
      :root {
        --bg: #09090b;
        --panel: rgba(24, 24, 27, 0.4);
        --border: #27272a;
        --text: #e4e4e7;
        --text-bright: #f4f4f5;
        --text-muted: #71717a;
        --text-faint: #52525b;
        --brand: #fdf5c6;
        --brand-fg: #000000;
        --active: #dcffc7;
        --warn: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        padding: 12px 24px;
      }

      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-bright);
      }

      header span {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }

      main {
        display: flex;
        flex: 1;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 24px;
        padding: 24px;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 280px;
      }

      .hint {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        line-height: 1.4;
        color: var(--text-muted);
      }

      .hint strong {
        color: var(--text-bright);
        font-weight: 500;
      }

      .main-column {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        min-width: 280px;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        padding: 12px;
      }

      .panel-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      #label {
        flex: 1;
        min-width: 0;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        padding: 2px 6px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }

      #snapshots {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 160px;
        overflow-y: auto;
      }

      #snapshots:empty::before {
        content: 'none yet';
        color: var(--text-faint);
        font-size: 11px;
      }

      .snapshot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        padding: 6px 8px;
        font-size: 11px;
      }

      .snapshot dl {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        color: var(--text-muted);
        min-width: 0;
      }

      .snapshot dl strong {
        color: var(--text-bright);
        font-weight: 500;
      }

      #log {
        margin: 0;
        height: 260px;
        overflow-y: auto;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        padding: 8px 12px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        line-height: 1.6;
        color: var(--text-muted);
        white-space: pre-wrap;
      }

      #status {
        margin: 0;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        color: var(--text-muted);
      }

      #status::before {
        content: '';
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 8px;
        border-radius: 50%;
        background: var(--text-faint);
      }

      #status[data-status='ready']::before {
        background: var(--active);
      }

      #status[data-status='connecting']::before,
      #status[data-status='waiting']::before {
        background: var(--warn);
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      video {
        width: 100%;
        aspect-ratio: 3 / 1;
        background: #000;
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      button {
        border: none;
        border-radius: 6px;
        background: var(--brand);
        color: var(--brand-fg);
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .snapshot button {
        flex-shrink: 0;
        padding: 2px 8px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>07 — Command Replies</h1>
      <span>Powered by Reactor</span>
    </header>
    <main>
      <div class="sidebar">
        <ol class="hint">
          <li><strong>1.</strong> Connect</li>
          <li><strong>2.</strong> Save a snapshot once the video starts</li>
          <li><strong>3.</strong> Each save appears below as a row with its own Rewind button</li>
        </ol>
        <div class="panel">
          <div class="panel-row">
            <p id="status">disconnected</p>
            <button id="connect">Connect</button>
          </div>
        </div>
        <div class="panel">
          <div class="panel-row">
            <input id="label" type="text" placeholder="snapshot label (optional)" />
            <button id="save" disabled>Save</button>
          </div>
          <div id="snapshots"></div>
        </div>
      </div>
      <div class="main-column">
        <video autoplay playsinline></video>
        <pre id="log"></pre>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
