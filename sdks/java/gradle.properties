org.gradle.parallel=true
org.gradle.caching=true

# Which JDK compiles and runs the build. 25 is what mise pins; CI overrides it
# to 22 as well, because 22 is the published floor and a floor nobody runs is a
# claim rather than a fact. Compilation targets release 22 either way — see
# buildSrc/src/main/kotlin/reactor-java-conventions.gradle.kts.
reactorJdk=25

# Gradle never fetches a JDK on its own: mise owns the local toolchain and
# actions/setup-java owns CI's. A missing JDK is a loud failure, not a silent
# download that disagrees with mise.lock.
org.gradle.java.installations.auto-download=false

# Where a JDK other than the one running Gradle is found. actions/setup-java
# exports JAVA_HOME_<major>_<arch> for whatever it installed, which is how the
# CI matrix runs the suite on the 22 floor while Gradle itself runs on the JDK
# mise pinned. Both runner architectures are listed because a missing variable
# here is ignored, and naming only X64 would make this quietly wrong the day a
# job moves to arm64. Locally, build on another JDK by making it the one Gradle
# runs on: `mise exec java@temurin-22.0.2+9 -- gradle ... -PreactorJdk=22`.
org.gradle.java.installations.fromEnv=JAVA_HOME_22_X64,JAVA_HOME_22_ARM64,JAVA_HOME_25_X64,JAVA_HOME_25_ARM64

# The Maven coordinates these artifacts publish under, and the version that rides
# into the jar manifest as Implementation-Version — which is what the client
# reports to the coordinator as client_info.sdk_version. A SNAPSHOT publishes
# nothing; J15 sets the first real version, and that bump is the release switch.
group=inc.reactor
version=1.0.0-SNAPSHOT

# Dokka's second-generation Gradle plugin, and the banner it prints on every build of every module
# once the choice has been read. Not optional at the version pinned in buildSrc: the first-generation
# plugin is gone from 2.1.0.
#
# 2.1.0 rather than 2.0.0 for a reason worth keeping: 2.0.0's bundled Kotlin analysis refuses to
# start on a JDK it does not recognise, and it does not recognise 25 — "IllegalArgumentException:
# 25.0.4" out of createCoreEnvironment, which is the JDK mise pins and the one CI publishes from.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
