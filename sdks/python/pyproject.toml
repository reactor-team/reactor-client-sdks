[project]
name = "reactor-sdk"
version = "0.9.0"
description = "Reactor client SDK — Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# No runtime dependencies: the SDK talks to libreactor_ffi through ctypes, which
# is in the standard library.
dependencies = []

[project.urls]
Repository = "https://github.com/reactor-team/reactor-client-sdks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# Dev-only; not shipped in the wheel. Installed by `mise run test:python`.
# hatchling is here so the tests can import hatch_build.py, which is otherwise only
# present in the isolated build environment.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["reactor"]

# Bundles libreactor_ffi and turns the wheel into a platform wheel. See
# hatch_build.py; without a library present it falls back to a pure wheel, so an
# editable install in a checkout still works.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# No sdist. The package is useless without libreactor_ffi, and a source
# distribution cannot carry a binary for a platform it does not know yet — it would
# install cleanly and then fail at the first call, which is worse than not being
# there. Build from the repository instead.
[tool.hatch.build.targets.sdist]
exclude = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import mode `importlib` keeps tests out of sys.path games, so `import reactor`
# resolves to the installed package rather than a sibling directory.
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
