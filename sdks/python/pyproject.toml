[project]
name = "reactor-sdk"
version = "0.9.0"
description = "Reactor client SDK — Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24.0",
]

[project.urls]
Repository = "https://github.com/reactor-team/reactor-client-sdks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reactor"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
