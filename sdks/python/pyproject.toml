[project]
name = "reactor-sdk"
version = "0.9.0"
description = "Reactor client SDK — Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# No runtime dependencies: the SDK talks to libreactor_ffi through ctypes, which
# is in the standard library.
dependencies = []

[project.urls]
Repository = "https://github.com/reactor-team/reactor-client-sdks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# Dev-only; not shipped in the wheel. Installed by `mise run test:python`.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["reactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import mode `importlib` keeps tests out of sys.path games, so `import reactor`
# resolves to the installed package rather than a sibling directory.
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
