name: Setup libwebrtc C++ toolchain
description: >
  Point CXX at the mise-pinned clang++ that compiles reactor-webrtc-sys's C++
  glue. No-op off Linux.

# Why this exists
# ───────────────
# reactor-webrtc-sys downloads a prebuilt libwebrtc, then compiles its own C++
# glue against it. On Linux it does that with `-nostdinc++` plus the archive's
# bundled libc++ headers, which track LLVM trunk — the distro clang++ on
# ubuntu-latest is too old to parse them and fails with errors like:
#
#   __format/unicode.h:204:19: error: invalid operands to binary expression
#     ('_Iterator' (aka '__wrap_iter<const char *>') and '_Iterator')
#
# macOS builds the glue against the platform libc++ and Windows against the MSVC
# STL, so both already match their toolchain — hence the Linux guard.
#
# This used to install clang from apt.llvm.org, which cost ~9 minutes per job and
# once sat on a single step for half an hour. clang is now a mise tool
# (`conda:clangxx` in mise.toml): exact-pinned, checksummed per platform in
# mise.lock, and restored from the cache every job already warms — the same deal
# every other tool in this repo gets. mise-action must have run before this.
#
# Only the compiler comes from here: libc++.a and libc++abi.a ship inside the
# prebuilt archive and are linked from there.

runs:
  using: composite
  steps:
    - name: Resolve the pinned clang++
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        if ! command -v mise >/dev/null; then
          echo "::error::mise is not on PATH — jdx/mise-action has to run before this."
          exit 1
        fi

        # `mise which` resolves the pin in mise.toml, installing it if the cache
        # was cold. Anything else on the runner is ignored on purpose: the point
        # of pinning is that CI and a contributor's laptop compile the glue with
        # the same compiler.
        mise install "conda:clangxx"
        CXX="$(mise which clang++)"

        # Compile something trivial before handing it to cargo. A conda toolchain
        # that cannot find its own headers fails here, in two lines of log, rather
        # than inside a cc-rs invocation several minutes later.
        printf '#include <cstddef>\nint main() { return 0; }\n' > /tmp/cxx-probe.cpp
        if ! "$CXX" -c /tmp/cxx-probe.cpp -o /tmp/cxx-probe.o; then
          echo "::error::$CXX cannot compile a trivial translation unit."
          exit 1
        fi

        echo "CXX=$CXX" >> "$GITHUB_ENV"
        "$CXX" --version
