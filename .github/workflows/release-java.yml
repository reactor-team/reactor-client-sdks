# Release the Java SDK to Maven Central.
#
# The version in sdks/java/gradle.properties is the switch: bumping it and merging
# to main is what publishes, and everything else on main is a no-op. Same shape as
# the other four release workflows, with two things specific to this one:
#
#   * Five native libraries, each built on the platform it targets, staged into
#     sdks/java/reactor-sdk-natives/natives/<token>/ and packaged as one classified
#     artifact per platform, and one jar carrying all five that reactor-sdk depends on.
#   * Central refuses a jar coordinate without its -sources and -javadoc companions,
#     so those are built by the ordinary `assemble` rather than by a release script.
#
# What the `maven` environment has to hold before any of this publishes anything.
# Only the release job below names that environment, so nothing else in this
# repository can sign or upload:
#
#   MAVEN_GPG_PRIVATE_KEY   the armoured private key, whole block, BEGIN and END
#                           lines included. Its *public* half must be on a
#                           keyserver — keys.openpgp.org or keyserver.ubuntu.com —
#                           because Central validates every signature against
#                           them. A key that exists only on a laptop signs a
#                           bundle that is then rejected, and the build cannot
#                           warn about it: the rejection arrives from the Portal.
#   MAVEN_GPG_PASSPHRASE    its passphrase
#   MAVEN_CENTRAL_USERNAME  half of a Portal *user token*, generated at
#   MAVEN_CENTRAL_PASSWORD  central.sonatype.com -> Account -> Generate User
#                           Token. Not the account login: the upload below sends
#                           base64("user:pass") as a bearer token, which is the
#                           scheme the Portal expects and the login does not
#                           satisfy.
#   PUBLISH_JAVA_RELEASE    "true". Anything else stages and uploads nothing,
#                           which is what makes merging safe before the rest of
#                           this is in place.
#
# To check the credentials without publishing: workflow_dispatch with
# dry_run=true. It stages and signs the real bundle, the unsigned-artifact guard
# runs, and it stops before the upload.
name: Release Java SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdks/java/**'
      - 'crates/**'
      - '.github/workflows/release-java.yml'
  pull_request:
    paths:
      - 'sdks/java/**'
      - '.github/workflows/release-java.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and stage without publishing'
        type: boolean
        default: true

concurrency:
  group: release-java
  cancel-in-progress: false

env:
  MISE_VERSION: "2026.8.8"
  MISE_LOCKED: "1"
  MISE_DISABLE_TOOLS: "rust,rustup,aqua:rust-lang/rustup"

permissions:
  contents: write

jobs:
  detect-version:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.diff.outputs.bumped }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff the SDK version across the pushed range
        id: diff
        run: |
          set -euo pipefail

          version_at() {
            git show "$1:sdks/java/gradle.properties" 2>/dev/null \
              | grep -m1 '^version=' \
              | sed -E 's/^version=([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/'
          }

          NEW_VER=$(version_at "${{ github.sha }}")
          if [ -z "$NEW_VER" ]; then
            echo "::error::could not read the version out of sdks/java/gradle.properties"
            exit 1
          fi
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"

          # A SNAPSHOT is never a release, whatever changed.
          case "$NEW_VER" in
            *-SNAPSHOT)
              echo "::notice::$NEW_VER is a snapshot — building, not releasing"
              echo "bumped=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "::notice::${{ github.event_name }} — building $NEW_VER, not releasing"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The whole pushed range, not HEAD^. A push can advance main by several commits — a
          # merge queue, a stack landing at once — and then HEAD^ already carries the new version
          # and the release the bump asked for silently never happens.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::no previous commit to diff against — not releasing"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VER=$(version_at "$BEFORE" || true)
          if [ "$NEW_VER" != "$OLD_VER" ]; then
            echo "::notice::version changed: ${OLD_VER:-none} -> $NEW_VER"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::version unchanged ($NEW_VER) — building, not releasing"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      # A version bump with no changelog entry ships undocumented, and the release notes point at
      # that file. Writes nothing: the entry is added by hand, in the same pull request as the bump.
      - name: Verify CHANGELOG.md documents this version
        if: steps.diff.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.diff.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -qF "## [${VERSION}]" sdks/java/CHANGELOG.md; then
            echo "::error::sdks/java/CHANGELOG.md has no '## [${VERSION}]' section — move the [Unreleased] entries under one before releasing."
            exit 1
          fi

  integration-tests:
    name: Integration tests (real FFI, real model)
    needs: detect-version
    # Skipped on pull_request only: ci.yml runs the same suite on the same commit, and reactor/echo
    # does not have the session quota for both workflows racing it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: true
          cache-shared-key: reactor-host-${{ hashFiles('mise.lock') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      - run: mise run build:ffi
      - run: mise run test:java:integration-tests
        env:
          INTEGRATION_TESTS_REACTOR_API_KEY: ${{ secrets.INTEGRATION_TESTS_REACTOR_API_KEY }}

  natives:
    name: Native library (${{ matrix.token }})
    needs: detect-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - token: linux-x86_64
            runner: ubuntu-latest
            library: libreactor_ffi.so
          - token: linux-aarch64
            runner: ubuntu-24.04-arm
            library: libreactor_ffi.so
          - token: macos-arm64
            runner: macos-latest
            library: libreactor_ffi.dylib
          - token: macos-x86_64
            runner: macos-13
            library: libreactor_ffi.dylib
          - token: windows-x86_64
            runner: windows-latest
            library: reactor_ffi.dll
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: true
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install clang for the libwebrtc C++ glue
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-libwebrtc-cxx
      - run: mise run build:ffi

      # Cargo writes the build machine's absolute path as the install name, so a package can link
      # correctly and still send the loader somewhere that only ever existed on a runner. The Java
      # SDK loads by explicit path, so this is not what makes it work — it is what stops the
      # artifact carrying a lie about itself.
      - name: Rewrite the macOS install name to @rpath
        if: runner.os == 'macOS'
        run: install_name_tool -id @rpath/${{ matrix.library }} target/release/${{ matrix.library }}

      - name: Stage it and record its size
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "sdks/java/reactor-sdk-natives/natives/${{ matrix.token }}"
          cp "target/release/${{ matrix.library }}" "sdks/java/reactor-sdk-natives/natives/${{ matrix.token }}/"
          SIZE=$(wc -c < "target/release/${{ matrix.library }}")
          # Recorded per platform because the packaging layout is a decision downstream of these
          # numbers: five separate artifacts make sense while each is tens of megabytes, and stop
          # making sense if they are not.
          echo "::notice::${{ matrix.token }}: $((SIZE / 1048576)) MB"
          echo "${{ matrix.token }} $SIZE" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.token }}
          path: sdks/java/reactor-sdk-natives/natives/${{ matrix.token }}/
          retention-days: 7

  release:
    name: Publish to Maven Central
    needs: [detect-version, integration-tests, natives]
    if: needs.detect-version.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    # The signing key, its passphrase, the Portal token and the kill switch all live in one
    # environment rather than loose in the repository. Only a job that names it can read them, so
    # this is the one job in this repository able to sign or upload anything — the live suite above
    # keeps reading INTEGRATION_TESTS_REACTOR_API_KEY from the repository, untouched.
    #
    # It is also where a protection rule would go, if this should ever need an approval before it
    # ships. Nothing here has to change for that.
    environment: maven
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Collect every platform's library
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: sdks/java/reactor-sdk-natives/natives/
      - name: Flatten the downloaded artifacts into the staging layout
        run: |
          set -euo pipefail
          cd sdks/java/reactor-sdk-natives/natives
          for directory in natives-*; do
            token="${directory#natives-}"
            mkdir -p "$token"
            mv "$directory"/* "$token"/
            rmdir "$directory"
          done
          ls -la */

      - name: Refuse to publish without all five platforms
        run: |
          set -euo pipefail
          cd sdks/java/reactor-sdk-natives/natives
          for token in linux-x86_64 linux-aarch64 macos-arm64 macos-x86_64 windows-x86_64; do
            if [ -z "$(ls -A "$token" 2>/dev/null)" ]; then
              echo "::error::no native library for $token — a release missing a platform resolves for everyone and fails at load for someone"
              exit 1
            fi
          done

      # Not `assemble`. Building the jars says nothing about whether they can be published: a
      # duplicated classifier, a POM without its licence block, a coordinate missing its -sources
      # companion — every one of those is a refusal that only appears when something actually
      # performs a publish. This stages the exact bundle, so the shape is checked here rather than
      # by Central after the version has been tagged.
      - run: mise run build:java:central-bundle
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      # Read in a step, not in a job-level `if`. An environment-scoped variable is resolved after
      # the condition decides whether the job runs, and checking it there has already silently
      # skipped a release that had tagged and built.
      - name: Is publishing switched on?
        id: switch
        env:
          PUBLISH: ${{ vars.PUBLISH_JAVA_RELEASE }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::dry run — staging only"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" != "true" ]; then
            echo "::notice::PUBLISH_JAVA_RELEASE is not 'true' — staging only"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # A signing block that quietly does nothing publishes an unsigned release the first time a
      # secret is misspelled, and Central's own refusal would arrive after the tag exists. Every
      # file in the bundle that is not a checksum must have its detached signature beside it.
      - name: Refuse to publish an unsigned bundle
        if: steps.switch.outputs.publish == 'true'
        run: |
          set -euo pipefail
          bundle=$(ls sdks/java/build/central-bundle/*-bundle.zip)
          rm -rf /tmp/bundle-check
          unzip -q "$bundle" -d /tmp/bundle-check
          unsigned=0
          while IFS= read -r file; do
            case "$file" in
              *.md5|*.sha1|*.sha256|*.sha512|*.asc) continue ;;
            esac
            if [ ! -f "${file}.asc" ]; then
              echo "::error::no signature for ${file#/tmp/bundle-check/}"
              unsigned=$((unsigned + 1))
            fi
          done < <(find /tmp/bundle-check -type f)
          if [ "$unsigned" -gt 0 ]; then
            echo "::error::$unsigned artifact(s) unsigned — check MAVEN_GPG_PRIVATE_KEY and MAVEN_GPG_PASSPHRASE"
            exit 1
          fi
          echo "::notice::every artifact in the bundle is signed"

      # One upload for the whole release: the Portal validates every coordinate together and
      # accepts or rejects them as one, which is what keeps a half-published version from existing.
      - name: Publish
        if: steps.switch.outputs.publish == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          VERSION: ${{ needs.detect-version.outputs.version }}
          # Validation is usually a minute or two; publication can take longer when Central is
          # busy. Long enough not to fail a healthy release, short enough that a stuck one does not
          # hold a runner all day.
          PUBLISH_TIMEOUT_SECONDS: '1800'
        run: |
          set -euo pipefail
          bundle=$(ls sdks/java/build/central-bundle/*-bundle.zip)
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')
          # AUTOMATIC: validated and then released without a second click in the Portal. A manual
          # gate here would leave the GitHub release below pointing at coordinates nobody can
          # resolve yet.
          deployment=$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --form "bundle=@${bundle}" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=reactor-sdk-${VERSION}&publishingType=AUTOMATIC" \
            | tr -d '[:space:]')
          if [ -z "$deployment" ]; then
            echo "::error::the Portal accepted the bundle but named no deployment"
            exit 1
          fi
          echo "::notice::deployment ${deployment}"

          # The upload is where this *starts*. A 200 means the Portal took the bundle, nothing more:
          # validation and publication run afterwards and can still end in FAILED. Returning here
          # would let the next step cut a GitHub release announcing coordinates that Central went on
          # to reject — a release note pointing at something nobody can resolve, and no failure
          # anywhere to say so.
          deadline=$(( $(date +%s) + PUBLISH_TIMEOUT_SECONDS ))
          while :; do
            body=$(curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: Bearer ${token}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${deployment}")
            state=$(printf '%s' "$body" | jq -r '.deploymentState // "UNKNOWN"')
            echo "deployment ${deployment}: ${state}"
            case "$state" in
              PUBLISHED)
                echo "::notice::Central published ${deployment}"
                break
                ;;
              FAILED)
                echo "::error::Central rejected ${deployment}"
                printf '%s' "$body" | jq -r '.errors // . '
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              # Not a success. The artifacts may yet publish, but this workflow has no way to know,
              # and a GitHub release is not something to cut on a maybe.
              echo "::error::deployment ${deployment} was still ${state} after ${PUBLISH_TIMEOUT_SECONDS}s — check the Portal before re-running"
              exit 1
            fi
            sleep 15
          done

      - name: Publish the GitHub release
        if: steps.switch.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "java-v${VERSION}" \
            --title "Java SDK ${VERSION}" \
            --notes "$(cat <<EOF
          Published to Maven Central:

          \`\`\`kotlin
          implementation("inc.reactor:reactor-sdk:${VERSION}")
          \`\`\`

          Requires JDK 22 or newer. Every platform's native library — Linux
          (x86_64, aarch64), macOS (arm64, x86_64) and Windows (x86_64) — comes
          with it and the SDK loads the one it needs, so there is nothing to
          install by hand and nothing to change when the code runs somewhere
          else. A build that wants only one platform's library takes a
          classifier instead; see \`sdks/java/README.md\` for that and for the
          artifact table, and \`sdks/java/CHANGELOG.md\` for what changed.
          EOF
          )"
