# Build and release the C++ SDK's platform archives.
#
# Triggered by a push to main that changes the version in
# sdks/cpp/CMakeLists.txt's project() call — the version is the release switch,
# so shipping is "bump the version and merge". Everything else on main is a no-op
# here.
#
# An archive is an install tree: headers, the static library, libreactor_ffi
# beside it, and the CMake package config. That is the whole product, because the
# package is useless without the native library and building that needs a Rust
# toolchain plus a libwebrtc download — which is exactly what a consumer of a C++
# SDK should not have to own.
#
# Five platforms, matching what reactor-webrtc ships and what the Python wheels
# cover.
#
# Pull requests that touch packaging or the FFI build the archives and upload them
# as artifacts, releasing nothing. workflow_dispatch does the same on demand. Only
# a push to main with a changed version releases.
name: Release C++ SDK

on:
  push:
    branches: [main]
    paths:
      - "sdks/cpp/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-cpp.yml"
      - "scripts/build-manylinux-cpp.sh"

  # Builds the matrix without releasing. The only way to find out whether it works
  # before it *is* the release path: a workflow only runs from the default branch,
  # so nothing here can be exercised by merging it and hoping.
  #
  # Narrow paths on purpose — five runners, two macOS and one Windows, each doing a
  # release build of libwebrtc's glue.
  pull_request:
    paths:
      - "sdks/cpp/CMakeLists.txt"
      - "sdks/cpp/cmake/**"
      - "crates/reactor-ffi/**"
      - ".github/workflows/release-cpp.yml"
      - "scripts/build-manylinux-cpp.sh"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the archives but do not create a release"
        type: boolean
        default: true

concurrency:
  group: release-cpp-${{ github.ref }}
  # Supersede an outdated pull-request build, but never interrupt a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Only cpp-integration-tests below uses mise (build-archives shells out to
  # cargo/cmake directly, on every platform, and needs no task runner for it) —
  # same pinned version ci.yml and release-python.yml use.
  MISE_VERSION: "2026.8.8"

jobs:
  # ── 0. Is this push a release? ──────────────────────────────────────────────
  detect-version:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.diff.outputs.bumped }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff the SDK version across the pushed range
        id: diff
        run: |
          set -euo pipefail

          version_at() {
            git show "$1:sdks/cpp/CMakeLists.txt" 2>/dev/null \
              | grep -A4 '^project(' \
              | grep -m1 'VERSION' \
              | sed -E 's/.*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/'
          }

          NEW_VER=$(version_at "${{ github.sha }}")
          if [ -z "$NEW_VER" ]; then
            echo "::error::could not read the version out of sdks/cpp/CMakeLists.txt"
            exit 1
          fi
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"

          # Pull requests and manual runs build but never release; only a push to
          # main that changes the version does that.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "::notice::${{ github.event_name }} — building $NEW_VER, not releasing"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The whole pushed range, not HEAD^. A push can advance main by several
          # commits — a merge queue, a stack landing at once — and then HEAD^ is a
          # commit that already carried the new version, so the release the bump
          # asked for silently never happens. Same reasoning, same guard, as the
          # Python release workflow.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::no previous commit to diff against (new branch or force-push) — not releasing"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VER=$(version_at "$BEFORE" || true)
          if [ "$NEW_VER" != "$OLD_VER" ]; then
            echo "::notice::version changed: ${OLD_VER:-none} -> $NEW_VER"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::version unchanged ($NEW_VER) — building, not releasing"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. One archive per platform ─────────────────────────────────────────────
  build-archives:
    name: Archive · ${{ matrix.platform }}
    needs: detect-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds inside a manylinux container, exactly as the Python
          # wheels do — see scripts/build-manylinux-cpp.sh, which owns that whole
          # build and therefore needs no target/lib entry here.
          #
          # manylinux_2_34 is AlmaLinux 9, whose glibc 2.34 is the floor the
          # README's platform table promises and what reactor-webrtc publishes
          # against. Built on the runner's own Ubuntu instead, the archive would
          # require glibc 2.39 and fail to load on every distribution that table
          # names.
          - platform: linux-x64
            os: ubuntu-latest
            container_image: quay.io/pypa/manylinux_2_34_x86_64

          - platform: linux-arm64
            # Native arm64 runner, so no qemu.
            os: ubuntu-24.04-arm
            container_image: quay.io/pypa/manylinux_2_34_aarch64

          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            # Rust's default floor for this target, and the README's promise. Left
            # unset, clang targets the runner's own macOS: the 1.0.0 rehearsal
            # produced a libreactor_sdk.a whose objects declared minos 26.0, in an
            # archive whose table says 11+.
            macos_deployment_target: "11.0"

          - platform: macos-x64
            # macos-13 is retired. The job sat unscheduled for 24 hours and was
            # cancelled, and `release` needs every archive — so one dead runner
            # label is what has been holding the whole release. macos-15-intel is
            # the x86_64 runner now, and what the Python wheels build on.
            os: macos-15-intel
            target: x86_64-apple-darwin
            # libwebrtc's x86_64 build requires 13.0, and the archive has to say
            # so: understating it ships a library that fails to load.
            macos_deployment_target: "13.0"

          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # libwebrtc.lib is built /MT, so Rust must match — as it does for the
            # Python wheel. Without this the link still succeeds, with LNK4098,
            # and the DLL carries two C runtimes.
            rustflags: "-C target-feature=+crt-static"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # ── Linux: everything happens in the container ──────────────────────────
      #
      # Mounting the checkout and running one script keeps the whole Linux build —
      # toolchain, native library, SDK, install tree — against AlmaLinux 9's glibc,
      # which is what makes the platform table's 2.34 true rather than asserted.
      # The host contributes nothing but the mount, so none of the runner setup
      # below applies; it picks the tree back up at `stage` and packages it.
      #
      # It also does away with the two-compiler dance the other Linux builds need:
      # the container's clang is the platform compiler, so it can build both the
      # libwebrtc glue and the SDK, and neither the mise pin nor
      # setup-libwebrtc-cxx has anything to do here.
      - name: Build in ${{ matrix.container_image }}
        if: matrix.container_image != ''
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/io -w /io \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            "${{ matrix.container_image }}" \
            bash /io/scripts/build-manylinux-cpp.sh

      # ── macOS and Windows: build on the runner ──────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: matrix.container_image == ''
        with:
          target: ${{ matrix.target }}
          cache-on-failure: true

      # Read by cargo for the native library and passed to CMake for the SDK
      # below. Both halves of the archive have to agree, and neither of them
      # defaults to the floor the README promises: cargo picks the target's own
      # (11.0 on arm64, 10.12 on x86_64) and clang picks the runner's macOS.
      - name: Set the macOS deployment target
        if: matrix.macos_deployment_target != ''
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"

      - name: Build libreactor_ffi
        if: matrix.container_image == ''
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build -p reactor-ffi --release --target ${{ matrix.target }}

      - name: Configure and install
        if: matrix.container_image == ''
        shell: bash
        run: |
          set -euo pipefail

          # Only on macOS, and spelled out rather than left to the environment:
          # CMake would infer it from MACOSX_DEPLOYMENT_TARGET, and an inference
          # is not what the platform table should rest on.
          extra=()
          if [ -n "${{ matrix.macos_deployment_target }}" ]; then
            extra+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }})
          fi

          cmake -S sdks/cpp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            -DREACTOR_FFI_LIB_DIR="$PWD/target/${{ matrix.target }}/release" \
            -DREACTOR_SDK_BUILD_TESTS=OFF \
            -DREACTOR_SDK_BUILD_EXAMPLES=OFF \
            "${extra[@]}"
          cmake --build build --config Release
          cmake --install build --config Release

      # The one thing worth checking before shipping: that the install tree is
      # consumable *somewhere else*. A missing export or a wrong target name is
      # invisible in the build and obvious to the first person who tries to link it
      # — and a path the export baked in still resolves here, on the machine that
      # produced it, which is exactly why this has to be checked after the move and
      # with the build output gone.
      - name: Relocate the install tree, as an archive is relocated
        shell: bash
        run: |
          set -euo pipefail
          mv stage unpacked
          # The cargo output the SDK linked against: nowhere on the machine that
          # unpacks the archive, so nowhere here either. The container script has
          # already done this for the Linux builds, from inside the mount, where
          # the files it wrote as root can still be removed.
          if [ -z "${{ matrix.container_image }}" ]; then
            rm -rf "target/${{ matrix.target }}/release"
          fi

      - name: Verify a consumer can find_package it
        shell: bash
        run: |
          set -euo pipefail
          cat > consumer_main.cpp <<'EOF'
          #include <iostream>
          #include <reactor/reactor.hpp>
          #include <reactor/version.hpp>
          int main() {
            // Enough to prove the headers, the library and the native library all
            // resolve: a client that never connects still reports its status.
            reactor::Reactor client{"reactor/helios", reactor::Jwt{"unused"}};
            std::cout << reactor::to_string(client.status()) << " " << reactor::version() << "\n";
          }
          EOF
          # The repo's own package fixture, so what a release archive is checked
          # against and what `mise run test:cpp:package` checks are one definition.
          # Its main.cpp is replaced with the fuller one above: a release is worth
          # constructing a client for, not only reading a version out of.
          cp -R sdks/cpp/tests/package consumer
          cp consumer_main.cpp consumer/main.cpp
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/unpacked"
          cmake --build consumer/build --config Release

          # And run it. Linking is the half that works when the archive is
          # missing the file that runs: the Windows archive shipped
          # reactor_ffi.dll.lib and no reactor_ffi.dll for as long as this step
          # stopped at `--build`, because the import library is all the linker
          # ever wanted. Multi-config generators put the binary a directory
          # deeper, so it is found rather than assumed.
          exe=$(find consumer/build -maxdepth 2 -type f \( -name consumer -o -name consumer.exe \) | head -1)
          if [ -z "$exe" ]; then
            echo "::error::the consumer built but produced no binary to run"
            exit 1
          fi
          "$exe"

      # The macOS half of the promise the platform table makes, checked the way the
      # container checks the glibc half. A static library carries the deployment
      # target of whatever built it, and an app targeting macOS 11 cannot link an
      # archive built for 26 — which is what shipped in the 1.0.0 rehearsal, where
      # every .a in lib/ declared minos 26.0 while the table said 11+.
      - name: Verify the archive's deployment target
        if: matrix.macos_deployment_target != ''
        shell: bash
        run: |
          set -euo pipefail
          floor="${{ matrix.macos_deployment_target }}"
          newest="0.0"
          for macho in unpacked/lib/*.a unpacked/lib/*.dylib; do
            [ -e "$macho" ] || continue
            for v in $(otool -l "$macho" | awk '/^ *minos /{print $2}' | sort -Vu); do
              echo "$(basename "$macho"): minos $v"
              if [ "$(printf '%s\n%s\n' "$newest" "$v" | sort -V | tail -1)" = "$v" ]; then
                newest="$v"
              fi
            done
          done
          if [ "$(printf '%s\n%s\n' "$floor" "$newest" | sort -V | tail -1)" != "$floor" ]; then
            echo "::error::the archive is built for macOS $newest, above the $floor the README promises"
            exit 1
          fi
          echo "Highest deployment target $newest, at or below the $floor floor"

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          NAME="reactor-sdk-cpp-${{ needs.detect-version.outputs.version }}-${{ matrix.platform }}"
          # `unpacked`, not `stage`: the verify step above moved it, which is the
          # point — what ships is the tree that was proven to work after a move.
          mv unpacked "$NAME"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$NAME.zip" "$NAME" >/dev/null
            echo "asset=$NAME.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            echo "asset=$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          ls -lh "$NAME".*

      - uses: actions/upload-artifact@v5
        with:
          name: archive-${{ matrix.platform }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  # ── 1b. Integration tests ────────────────────────────────────────────────────
  #
  # `reactor::Reactor` talks to `libreactor_ffi` directly regardless of
  # platform, so unlike build-archives this needs no matrix — one Linux run is
  # what proves the SDK itself works end to end against a real model, the same
  # reasoning release-python.yml's own integration step uses.
  cpp-integration-tests:
    name: C++ SDK integration tests (real FFI, real model)
    needs: detect-version
    # Skipped on pull_request: ci.yml's cpp-integration-tests job already runs
    # this same suite against the same commit, required via ci-complete, and
    # reactor/echo's session quota doesn't have room for both workflows racing
    # it at once — the exact collision js-integration-tests hit in practice
    # (see release-js.yml's own note, and ci.yml's cpp-integration-tests job).
    # No redundancy is lost: nothing publishes off a pull_request event (the
    # release/publish gate below), so this only needs to run before an actual
    # release, on push or workflow_dispatch.
    if: github.event_name != 'pull_request'
    # See ci.yml's js-integration-tests job for the full reasoning: this
    # workflow's own top-level `concurrency:` is keyed on the ref, so it does
    # nothing across a concurrent ci.yml run on the same push — which is
    # exactly the collision release-js.yml's build job already hit in
    # practice. Same per-commit group as every other job here that creates
    # reactor/echo sessions — see ci.yml's own comment for why it's scoped to
    # github.sha rather than one name shared by every PR.
    concurrency:
      group: reactor-echo-live-session-quota-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: true
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      - name: Build libreactor_ffi (the library the SDK links)
        run: mise run build:ffi
      # Same two-compiler split as ci.yml's `cpp` and `cpp-integration-tests`
      # jobs: switching before build:ffi above, instead of after, reproduces
      # the exact ABI mismatch that task exists to avoid, since
      # test:cpp:integration-tests does not build the FFI itself for that
      # same reason.
      - name: Use the platform clang for the SDK itself
        run: |
          set -euo pipefail
          if [ ! -x /usr/bin/clang++ ]; then
            echo "::error::/usr/bin/clang++ is missing on this runner image."
            exit 1
          fi
          echo "CXX=/usr/bin/clang++" >> "$GITHUB_ENV"
      - name: Integration tests (real FFI client, real model)
        env:
          INTEGRATION_TESTS_REACTOR_API_KEY: ${{ secrets.INTEGRATION_TESTS_REACTOR_API_KEY }}
        run: mise run test:cpp:integration-tests

  # ── 2. The release ──────────────────────────────────────────────────────────
  #
  # PUBLISH_CPP_RELEASE is the kill switch, and it is read in a *step* rather than
  # in the job's `if`. That is load-bearing: the variable lives on the `cpp-release`
  # environment, and a job-level condition is evaluated before the environment is
  # resolved — read there it is always empty, so the switch looks permanently off.
  # That is how the Python 1.0.0 release built and tagged and never reached PyPI.
  release:
    name: Release
    needs: [detect-version, build-archives, cpp-integration-tests]
    # An explicit `if` replaces the implicit "every `needs` entry succeeded"
    # gate rather than adding to it, so cpp-integration-tests's own success is
    # spelled out here too — it always runs (never skipped) whenever this
    # condition can be true, since both gate on the same push event.
    if: >-
      github.event_name == 'push' && needs.detect-version.outputs.bumped == 'true' &&
      needs.cpp-integration-tests.result == 'success'
    runs-on: ubuntu-latest
    environment: cpp-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist/

      - name: Check the kill switch
        id: switch
        env:
          PUBLISH_CPP_RELEASE: ${{ vars.PUBLISH_CPP_RELEASE }}
        run: |
          set -euo pipefail
          if [ "${PUBLISH_CPP_RELEASE:-true}" != "true" ]; then
            echo "::warning::PUBLISH_CPP_RELEASE is '${PUBLISH_CPP_RELEASE}' — not releasing."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect assets
        if: steps.switch.outputs.go == 'true'
        id: assets
        run: |
          set -euo pipefail
          cd dist
          # Namespaced, as the Python tags are: cpp-v1.0.0 says which thing shipped.
          echo "tag=cpp-v${{ needs.detect-version.outputs.version }}" >> "$GITHUB_OUTPUT"
          sha256sum ./* | tee SHA256SUMS
          ls -lh

      - name: Create the release
        if: steps.switch.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG exists — replacing its assets"
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi

          gh release create "$TAG" dist/* \
            --title "C++ SDK ${VERSION}" \
            --notes "$(cat <<EOF
          The Reactor C++ SDK ${VERSION} — one archive per platform.

          Each archive is an install tree: the headers, \`libreactor_sdk\`, a CMake
          package config, and \`libreactor_ffi\` beside them. Extract it and point
          CMake at it:

          \`\`\`cmake
          find_package(reactor-sdk REQUIRED)
          target_link_libraries(app PRIVATE reactor::sdk)
          \`\`\`

          \`\`\`
          cmake -S . -B build -DCMAKE_PREFIX_PATH=/path/to/reactor-sdk-cpp-${VERSION}-<platform>
          \`\`\`

          There is no source archive: the package is useless without the native
          library, and building that needs a Rust toolchain and a libwebrtc download.

          Linux needs glibc 2.34 or newer (x86_64, aarch64), macOS 11+ on arm64 and
          13+ on x86_64, and Windows x86_64 — the same five platforms
          \`reactor-webrtc\` ships. Anything else has to build the library itself; the
          README has the table and the instructions.

          Checksums are in \`SHA256SUMS\`.
          EOF
          )"
