name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_VERSION: "2026.8.8"    # pinned; must be >= mise.toml min_version
  # Workflow-level so every step (mise-action AND the `mise run` steps) sees it.
  MISE_LOCKED: "1"            # install/run only mise.lock versions; never float
  # CI installs the Rust toolchain via actions-rust-lang/setup-rust-toolchain
  # (reads rust-toolchain.toml). Disable mise's rust/rustup so the action owns it.
  # That action also exports RUSTFLAGS="-D warnings" - kept on purpose: warnings
  # are errors in CI.
  MISE_DISABLE_TOOLS: "rust,rustup,aqua:rust-lang/rustup"

jobs:
  # Which jobs have anything to do.
  #
  # One binding's PR must not build another's: nobody editing the Python SDK
  # should pay for a C++ toolchain, and a red C++ build on a Python-only PR is
  # what teaches a team to ignore red. The converse matters more — a change under
  # crates/ is EVERY binding's business, because it can move the ABI out from
  # under one, so it triggers all of them.
  #
  # Skipping is safe only because `ci-complete` is the single required check: it
  # needs every job and runs `if: always()`, so a skipped job is a pass rather
  # than a check that never reports and a pull request that waits forever.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      js: ${{ steps.filter.outputs.js }}
      cpp: ${{ steps.filter.outputs.cpp }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'mise.toml'
              - 'mise.lock'
            core: &core
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            rust:
              - *shared
              - *core
            python:
              - *shared
              - *core
              - 'sdks/python/**'
            js:
              - *shared
              - *core
              - 'sdks/js/**'
            cpp:
              - *shared
              - *core
              - 'sdks/cpp/**'

  # Repo-wide checks: fast, text-only, and about the repository rather than about
  # any one binding — so they always run and need no compiler.
  repo:
    name: repo lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # mise.lock drift check diffs against the merge-base
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - run: hk validate
      - name: ABI parity (lib.rs / reactor_ffi.h / _ffi.py / sdks/cpp)
        run: mise run lint:abi
      - name: Error-code parity (error.rs / errors.ts / errors.py / errors.hpp)
        run: mise run lint:error-codes
      - run: mise run lint:shell
      - name: Secret scan (git history)
        run: mise run lint:secrets
      - run: mise run lint:mise-tools-root
      - name: mise.lock drift (vs merge-base)
        run: mise run lint:mise-lock

  rust:
    name: Rust core
    needs: changes
    # Everything runs on a push to main: the filters answer "what did this pull
    # request touch", and on main there is no pull request to ask about.
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          cache-on-failure: true
          # Keyed on the toolchain lockfile because the Rust cache holds C++
          # objects: reactor-webrtc-sys compiles its glue with the clang mise
          # pins, and reusing objects built by a different one is the ABI
          # mismatch its build.rs warns about — silently, since Cargo's
          # fingerprint does not see the compiler swap. A tool bump is a cache
          # miss now, which is the safe direction.
          cache-key: ${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run fmt:check
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      # Covers reactor-ffi, which is why the clang above is needed.
      - run: mise run clippy
      - run: mise run test:rust

  python:
    name: Python SDK
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          cache-on-failure: true
          cache-key: ${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run lint:python
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      # Builds the cdylib so the ctypes contract tests run instead of skipping —
      # they are the only check that _ffi.py's argtypes match the compiled ABI.
      - name: Build libreactor_ffi for the ctypes contract tests
        run: mise run build:ffi
      - run: mise run test:python

  python-integration-tests:
    name: Python SDK integration tests (real FFI, real model)
    # Depends on js-integration-tests finishing, not just `changes`: both
    # suites hit the same real reactor/echo model, whose session-creation
    # quota (sessions_per_minute) is shared and far too small for both to
    # run at once — running in parallel 429ed nearly every test in both
    # jobs. A custom `if:` below (no success()/failure()/always() in it)
    # already overrides the implicit "needs must succeed" gate, so this
    # only serializes the two — it does not make one depend on the other's
    # result.
    needs: [changes, js-integration-tests]
    # Same fork-PR reasoning as js-integration-tests below: GitHub withholds
    # repo secrets from a fork's pull_request runs, so
    # INTEGRATION_TESTS_REACTOR_API_KEY would never be populated there —
    # skipped rather than failing every external contribution. Still runs
    # for every same-repo PR and on push.
    if: github.event_name == 'push' || (needs.changes.outputs.python == 'true' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: true
          cache-key: ${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      - name: Integration tests (real FFI client, real model)
        env:
          # A dedicated secret, not the general REACTOR_API_KEY examples use —
          # this key exists only to run this suite (shared with js-integration-tests).
          INTEGRATION_TESTS_REACTOR_API_KEY: ${{ secrets.INTEGRATION_TESTS_REACTOR_API_KEY }}
        run: mise run test:python:integration-tests

  js:
    name: JS SDK + browser binding
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml,
        with:                                            # including the wasm32 target
          cache-on-failure: true
          cache-key: ${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/setup-node@v4   # Node isn't mise-pinned yet; see mise.toml's "JS SDK" section
        with:
          node-version: "24"
      # reactor-wasm compiles to nothing off a wasm target, so the rust job's
      # host-target clippy covers none of it. No clang needed here: this target
      # pulls in reactor-core only, never reactor-ffi's libwebrtc glue.
      - run: mise run clippy:wasm
      # Proves the binding still links and that wasm-bindgen can emit the JS
      # package the SDK imports — a clippy pass alone would not.
      - run: mise run build:wasm
      - run: mise run lint:js
      # Builds the SDK against the real reactor-wasm output above — the one thing
      # a local checkout without a Rust toolchain can't verify.
      - run: mise run build:js
      - run: mise run test:js

  js-integration-tests:
    name: JS SDK integration tests (real browser, real model)
    needs: changes
    # GitHub withholds repo secrets from a fork's pull_request runs, so a
    # fork PR could never populate INTEGRATION_TESTS_REACTOR_API_KEY —
    # skipped there rather than failing every external contribution. Still
    # runs for every same-repo PR and on push, same as before.
    if: github.event_name == 'push' || (needs.changes.outputs.js == 'true' && github.event.pull_request.head.repo.full_name == github.repository)
    # No cross-workflow lock against reactor/echo's shared session-creation
    # quota (there used to be one — a `reactor-echo-live-session-quota-<sha>`
    # environment referenced here and by every release-*.yml integration
    # job for the same commit, which GitHub queues arbitrarily deep instead
    # of cancelling past a `concurrency:` group's one-running/one-pending
    # limit. Dropped because it left a permanent, never-cleaned-up
    # environment per commit for no ongoing benefit — see below).
    #
    # Each suite paces its own session creation to ~86/min (see
    # conftest.py/fixtures.cpp/this suite's own harness), so the worst case —
    # a push touching crates/** firing ci.yml plus all three release-*.yml
    # workflows at once, 4 simultaneous same-commit claimants — sums to
    # ~344/min, comfortably under the 500/min quota (raised from 100, itself
    # raised from 10). A commit/PR racing an unrelated one is accepted the
    # same as before: paced_connect()'s own retry-on-429 covers that
    # residual case. Revisit if a 5th binding (Swift, in progress) or looser
    # per-suite pacing pushes the worst case close to 500 again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: true
          cache-key: ${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # test:js:integration-tests builds wasm + dist/ itself (mise.toml)
      # rather than reusing the `js` job's — same reasoning as
      # release-js.yml's build job: never test something that wasn't built
      # by the exact steps that just ran.
      - name: Integration tests (Playwright, real browser + real model)
        env:
          # A dedicated secret, not the general REACTOR_API_KEY examples use —
          # this key exists only to run this suite.
          INTEGRATION_TESTS_REACTOR_API_KEY: ${{ secrets.INTEGRATION_TESTS_REACTOR_API_KEY }}
        run: mise run test:js:integration-tests

  cpp:
    name: C++ SDK
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          cache-on-failure: true
          cache-key: ${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      # Sets CXX to the pinned conda clang++, which the step below needs and the
      # ones after it must not use.
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      - name: Build libreactor_ffi (the library the SDK links)
        run: mise run build:ffi
      # The pinned clang++ exists only to compile that glue against libwebrtc's
      # own libc++ headers. It also brings conda's linker and sysroot, which
      # cannot resolve the GLIBC_2.34 symbols the .so it just produced needs from
      # the system glibc — so the SDK is built with the runner's own clang,
      # against the same libc as everything else it links.
      #
      # By absolute path, not `command -v clang++`: mise puts the conda toolchain
      # on PATH, so looking the name up finds the very compiler being avoided.
      #
      # clang rather than g++ because clang-tidy asks $CXX where the compiler
      # keeps its builtin headers and only clang answers — and with
      # REACTOR_REQUIRE_CLANG_TIDY set, a host that cannot answer fails the job
      # instead of quietly skipping the check.
      - name: Use the platform clang for the SDK itself
        run: |
          set -euo pipefail
          if [ ! -x /usr/bin/clang++ ]; then
            echo "::error::/usr/bin/clang++ is missing on this runner image."
            exit 1
          fi
          echo "CXX=/usr/bin/clang++" >> "$GITHUB_ENV"
          echo "REACTOR_REQUIRE_CLANG_TIDY=1" >> "$GITHUB_ENV"
          /usr/bin/clang++ --version
      # Fetches nlohmann/json and Catch2 at configure time.
      - run: mise run lint:cpp
      - run: mise run test:cpp

  cpp-integration-tests:
    name: C++ SDK integration tests (real FFI, real model)
    # Depends on python-integration-tests finishing, not just `changes`: all
    # three integration suites hit the same real reactor/echo model, whose
    # session-creation quota (sessions_per_minute) is shared and far too small
    # for more than one to run at once — js-integration-tests and
    # python-integration-tests already learned this the hard way (see that
    # job's own comment). A custom `if:` below (no success()/failure()/
    # always() in it) already overrides the implicit "needs must succeed"
    # gate, so this only serializes the chain js -> python -> cpp; it doesn't
    # make this job depend on either of the others' results.
    needs: [changes, python-integration-tests]
    # Same fork-PR reasoning as the other two integration jobs: GitHub
    # withholds repo secrets from a fork's pull_request runs, so
    # INTEGRATION_TESTS_REACTOR_API_KEY would never be populated there —
    # skipped rather than failing every external contribution. Still runs for
    # every same-repo PR and on push.
    if: github.event_name == 'push' || (needs.changes.outputs.cpp == 'true' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: true
          cache-key: ${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      - name: Build libreactor_ffi (the library the SDK links)
        run: mise run build:ffi
      # Same two-compiler split as the `cpp` job above: the conda clang++ just
      # built libreactor_ffi's libwebrtc glue, but the SDK itself (and this
      # suite) must link against the runner's own glibc — switching before
      # `build:ffi` above, instead of after, reproduced the exact ABI mismatch
      # `mise run build:ffi` exists to avoid, since test:cpp:integration-tests
      # does not build the FFI itself for that same reason.
      - name: Use the platform clang for the SDK itself
        run: |
          set -euo pipefail
          if [ ! -x /usr/bin/clang++ ]; then
            echo "::error::/usr/bin/clang++ is missing on this runner image."
            exit 1
          fi
          echo "CXX=/usr/bin/clang++" >> "$GITHUB_ENV"
      - name: Integration tests (real FFI client, real model)
        env:
          # A dedicated secret, not the general REACTOR_API_KEY examples use —
          # this key exists only to run this suite (shared with
          # js-integration-tests/python-integration-tests).
          INTEGRATION_TESTS_REACTOR_API_KEY: ${{ secrets.INTEGRATION_TESTS_REACTOR_API_KEY }}
        run: mise run test:cpp:integration-tests

  ci-complete:
    name: CI Complete
    needs:
      [
        changes,
        repo,
        rust,
        python,
        python-integration-tests,
        js,
        js-integration-tests,
        cpp,
        cpp-integration-tests,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A skipped job is a pass: that is the whole point of the filters above, and
      # what makes this the only check `main` needs to require. A *failed* or
      # cancelled one is not, whichever job it was.
      - name: Verify no job failed
        run: |
          for r in "${{ needs.changes.result }}" \
                   "${{ needs.repo.result }}" \
                   "${{ needs.rust.result }}" \
                   "${{ needs.python.result }}" \
                   "${{ needs.python-integration-tests.result }}" \
                   "${{ needs.js.result }}" \
                   "${{ needs.js-integration-tests.result }}" \
                   "${{ needs.cpp.result }}" \
                   "${{ needs.cpp-integration-tests.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job failed ($r)"; exit 1
            fi
          done
          echo "All CI checks passed."
