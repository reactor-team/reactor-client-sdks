name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_VERSION: "2026.8.8"    # pinned; must be >= mise.toml min_version
  # Workflow-level so every step (mise-action AND the `mise run` steps) sees it.
  MISE_LOCKED: "1"            # install/run only mise.lock versions; never float
  # CI installs the Rust toolchain via actions-rust-lang/setup-rust-toolchain
  # (reads rust-toolchain.toml). Disable mise's rust/rustup so the action owns it.
  # That action also exports RUSTFLAGS="-D warnings" - kept on purpose: warnings
  # are errors in CI.
  MISE_DISABLE_TOOLS: "rust,rustup,aqua:rust-lang/rustup"

jobs:
  # Which jobs have anything to do.
  #
  # One binding's PR must not build another's: nobody editing the Python SDK
  # should pay for a C++ toolchain, and a red C++ build on a Python-only PR is
  # what teaches a team to ignore red. The converse matters more — a change under
  # crates/ is EVERY binding's business, because it can move the ABI out from
  # under one, so it triggers all of them.
  #
  # Skipping is safe only because `ci-complete` is the single required check: it
  # needs every job and runs `if: always()`, so a skipped job is a pass rather
  # than a check that never reports and a pull request that waits forever.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      js: ${{ steps.filter.outputs.js }}
      cpp: ${{ steps.filter.outputs.cpp }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
      swift: ${{ steps.effective.outputs.swift }}
      swift_package: ${{ steps.effective.outputs.swift_package }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not just enough for bot-checksum's diff below:
          # actions/checkout's default ref for a pull_request event is the
          # synthetic refs/pull/<n>/merge commit, whose parents are (base,
          # head) — a shallow fetch keyed to *that* commit isn't guaranteed
          # to include the head commit's own parent, which bot-checksum
          # needs. fetch-depth: 0 sidesteps the question entirely.
          fetch-depth: 0
      - name: Is this push exactly release-swift.yml's checksum commit?
        id: bot-checksum
        run: |
          set -euo pipefail
          # release-swift.yml's stage-release job pushes a commit, as
          # github-actions[bot], that touches nothing but Package.swift's
          # releasedFFI line (see that workflow's own header comment). That
          # push retriggers this workflow on the same PR, and Package.swift
          # is in both the `swift` and `swift_package` filters below, so
          # without this check every Swift job here — not just the
          # XCFramework rebuild, but the plain Swift SDK build and both live
          # integration-test suites — would rerun to validate source that
          # hasn't changed since the previous commit. Beyond the wasted
          # ~15-20 minutes, rerunning the integration suites means a second
          # unnecessary shot at reactor/echo's live session quota, on a run
          # that has nothing to do with Swift source at all.
          #
          # Diffed by explicit SHA, not bare HEAD/HEAD^: checkout's actual
          # HEAD on a pull_request event is the synthetic
          # refs/pull/<n>/merge commit, whose first parent is the *base*
          # branch's tip — HEAD^..HEAD there is the PR's entire cumulative
          # diff against main, not this one push's diff. Found the hard way,
          # watching this wrongly stay false on a real release PR's own
          # follow-up push.
          SKIP=false
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.actor }}" = "github-actions[bot]" ] && \
             [ "$(git diff --name-only "${HEAD_SHA}^" "$HEAD_SHA")" = "Package.swift" ]; then
            SKIP=true
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'mise.toml'
              - 'mise.lock'
            core: &core
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            rust:
              - *shared
              - *core
            python:
              - *shared
              - *core
              - 'sdks/python/**'
            js:
              - *shared
              - *core
              - 'sdks/js/**'
            kotlin:
              - *shared
              - *core
              - 'sdks/kotlin/**'
              - 'scripts/kotlin.sh'
              - 'scripts/check-kotlin-ci.py'
            cpp:
              - *shared
              - *core
              - 'sdks/cpp/**'
            # Package.swift is at the repository root — SwiftPM will not resolve
            # a package in a subdirectory — so it is named here alongside the
            # sources it points at.
            swift:
              - *shared
              - *core
              - 'sdks/swift/**'
              - 'Package.swift'
              - 'scripts/swift.sh'
            # Narrower than `swift` on purpose: this one builds four Rust target
            # triples, each downloading its own prebuilt libwebrtc. It is worth
            # that for a change to packaging or to the library the package
            # carries, and not worth it for a change to the Swift object model.
            swift_package:
              - *shared
              - 'Package.swift'
              - 'scripts/build-swift-xcframework.sh'
              - 'scripts/swift-package-check.sh'
              - 'crates/reactor-ffi/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'

      # Overrides the raw filter results above with `false` when this push is
      # bot-checksum's own commit — see that step's comment. Done once, here,
      # rather than in each of the four Swift jobs' own `if:` (swift,
      # swift-package, and both swift-integration-tests jobs all key off
      # `needs.changes.outputs.swift`/`swift_package`): a job-by-job repeat of
      # this condition is a fifth place to keep in sync, and Codex review on
      # the equivalent release-swift.yml check already flagged how easy a
      # partial version of this guard is to get wrong.
      - name: Effective swift filters (a bot-checksum-only push never counts)
        id: effective
        run: |
          set -euo pipefail
          if [ "${{ steps.bot-checksum.outputs.skip }}" = "true" ]; then
            echo "swift=false" >> "$GITHUB_OUTPUT"
            echo "swift_package=false" >> "$GITHUB_OUTPUT"
          else
            echo "swift=${{ steps.filter.outputs.swift }}" >> "$GITHUB_OUTPUT"
            echo "swift_package=${{ steps.filter.outputs.swift_package }}" >> "$GITHUB_OUTPUT"
          fi

  # Repo-wide checks: fast, text-only, and about the repository rather than about
  # any one binding — so they always run and need no compiler.
  repo:
    name: repo lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # mise.lock drift check diffs against the merge-base
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - run: hk validate
      - run: mise run test:kotlin:ci
      - name: ABI parity (lib.rs / reactor_ffi.h / _ffi.py / sdks/cpp / sdks/swift)
        run: mise run lint:abi
      - name: Error-code parity (error.rs / errors.ts / errors.py / errors.hpp)
        run: mise run lint:error-codes
      - run: mise run lint:shell
      - name: Secret scan (git history)
        run: mise run lint:secrets
      - run: mise run lint:mise-tools-root
      - name: mise.lock drift (vs merge-base)
        run: mise run lint:mise-lock

      # Blocks CI Complete on a version-bump PR until release-swift.yml's
      # stage-release job has committed the release checksum onto this
      # PR's branch — see that workflow's header comment for the full
      # mechanism. Lives here, as a step in a job ci.yml already always
      # runs, rather than as its own required check: a required check
      # cannot depend on a job in a different workflow file, and this repo
      # already treats "CI Complete passes" as the one thing every PR has
      # to satisfy.
      #
      # Polls instead of failing immediately when the checksum isn't there
      # yet — which it never is on the very first push, since
      # release-swift.yml's build takes on the order of ten minutes. This
      # is cosmetic, not load-bearing: stage-release's own commit is a new
      # push to this branch, which reruns ci.yml on its own regardless, and
      # that later run is what actually determines whether the PR can
      # merge (GitHub evaluates a required check against the current head
      # commit, not this run's). Without the poll, this run would just fail
      # fast and get superseded a few minutes later — functionally
      # identical, but a needless red X in the interim. The tradeoff is
      # this step (and the runner under it) sits idle for however long the
      # wait lasts, only for pull_request runs that reach this point.
      - name: Wait for the Swift release checksum, if this PR bumps the version
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          version_at() {
            git show "$1:sdks/swift/Sources/Reactor/ReactorSDK.swift" 2>/dev/null \
              | sed -n 's/.*public static let version = "\([^"]*\)".*/\1/p' \
              | head -1
          }

          git fetch origin main
          NEW_VER=$(version_at HEAD)
          BASE_VER=$(version_at origin/main)

          if [ "$BASE_VER" = "$NEW_VER" ]; then
            echo "Version unchanged (${NEW_VER:-<none>}) — not a release PR, nothing to wait for."
            exit 0
          fi

          echo "This PR bumps the Swift SDK version: ${BASE_VER:-<none>} -> ${NEW_VER}."

          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::This PR's branch is on a fork. release-swift.yml's stage-release job refuses to push a checksum commit onto a fork's branch, so this will never resolve — see release-swift.yml's stage-release job comment. A maintainer needs to open this version bump from a branch on this repo instead." >&2
            exit 1
          fi

          BRANCH="${{ github.head_ref }}"
          DEADLINE=$((SECONDS + 1200))   # 20 minutes — build-xcframework alone runs ~10
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            git fetch origin "$BRANCH"
            if git show "origin/${BRANCH}:Package.swift" \
                | grep -q '^let releasedFFI: (url: String, checksum: String)? = (url: "'; then
              echo "Checksum committed on origin/${BRANCH} — release-swift.yml's stage-release finished."
              exit 0
            fi
            echo "Not yet — release-swift.yml's stage-release job is presumably still building. Checking again in 30s ($((DEADLINE - SECONDS))s left)."
            sleep 30
          done

          echo "::error::Timed out waiting for release-swift.yml's stage-release job to commit the release checksum onto this branch. Check that job's own status in the Actions tab — if it failed, this will never resolve on its own; push a fix and this step will pick it up on the next run." >&2
          exit 1

  rust:
    name: Rust core
    needs: changes
    # Everything runs on a push to main: the filters answer "what did this pull
    # request touch", and on main there is no pull request to ask about.
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          cache-on-failure: true
          # Keyed on the toolchain lockfile because the Rust cache holds C++
          # objects: reactor-webrtc-sys compiles its glue with the clang mise
          # pins, and reusing objects built by a different one is the ABI
          # mismatch its build.rs warns about — silently, since Cargo's
          # fingerprint does not see the compiler swap. A tool bump is a cache
          # miss now, which is the safe direction.
          #
          # cache-shared-key (not cache-key): this job, python, cpp and their
          # integration-test counterparts all compile the same reactor-core /
          # reactor-protocol / reactor-ffi for the same host target with the
          # same clang — one shared cache instead of five near-duplicates. js
          # / js-integration-tests are deliberately not in this group: they
          # build only for wasm32 and share nothing with the host-target
          # artifacts here (see their own shared key below).
          cache-shared-key: reactor-host-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run fmt:check
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      # Covers reactor-ffi, which is why the clang above is needed.
      - run: mise run clippy
      - run: mise run test:rust

  python:
    name: Python SDK
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          cache-on-failure: true
          # See the rust job's cache-shared-key comment above.
          cache-shared-key: reactor-host-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run lint:python
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      # Builds the cdylib so the ctypes contract tests run instead of skipping —
      # they are the only check that _ffi.py's argtypes match the compiled ABI.
      - name: Build libreactor_ffi for the ctypes contract tests
        run: mise run build:ffi
      - run: mise run test:python

  python-integration-tests:
    name: Python SDK integration tests (real FFI, real model)
    # No longer chained onto js-integration-tests (see that job's own
    # comment): each suite self-paces its own session creation to ~86/min,
    # well under the shared reactor/echo quota (500/min), so running every
    # binding's integration suite at once no longer needs artificial
    # serialization to stay under it. Experimental — see js-integration-tests.
    needs: changes
    # Same fork-PR reasoning as js-integration-tests below: GitHub withholds
    # repo secrets from a fork's pull_request runs, so
    # INTEGRATION_TESTS_REACTOR_API_KEY would never be populated there —
    # skipped rather than failing every external contribution. Still runs
    # for every same-repo PR and on push.
    if: github.event_name == 'push' || (needs.changes.outputs.python == 'true' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: true
          # See the rust job's cache-shared-key comment above.
          cache-shared-key: reactor-host-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      - name: Integration tests (real FFI client, real model)
        env:
          # A dedicated secret, not the general REACTOR_API_KEY examples use —
          # this key exists only to run this suite (shared with js-integration-tests).
          INTEGRATION_TESTS_REACTOR_API_KEY: ${{ secrets.INTEGRATION_TESTS_REACTOR_API_KEY }}
        run: mise run test:python:integration-tests

  js:
    name: JS SDK + browser binding
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml,
        with:                                            # including the wasm32 target
          cache-on-failure: true
          # cache-shared-key (not cache-key): this job and js-integration-tests
          # both compile reactor-wasm (and reactor-core/reactor-protocol for
          # wasm32) — one shared cache between the two instead of duplicating
          # it. Deliberately a different key than the host-target jobs' (see
          # the rust job): wasm32 artifacts share nothing with those, and
          # mixing them into one cache would only grow it for no reuse.
          cache-shared-key: reactor-wasm-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/setup-node@v4   # Node isn't mise-pinned yet; see mise.toml's "JS SDK" section
        with:
          node-version: "24"
      # wasm-pack fetches its own wasm-opt/binaryen binary straight from
      # GitHub releases on first use — outside mise's cache entirely, and a
      # real (if infrequent) source of flaky failures on that download (see
      # REA-5659's PR #151 CI run). Cached here so a run only ever pays for
      # that download once per wasm-pack version.
      - name: Cache wasm-pack's wasm-opt/binaryen download
        uses: actions/cache@v4
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-binaryen-${{ hashFiles('mise.lock') }}
      # reactor-wasm compiles to nothing off a wasm target, so the rust job's
      # host-target clippy covers none of it. No clang needed here: this target
      # pulls in reactor-core only, never reactor-ffi's libwebrtc glue.
      - run: mise run clippy:wasm
      # Proves the binding still links and that wasm-bindgen can emit the JS
      # package the SDK imports — a clippy pass alone would not.
      - run: mise run build:wasm
      - run: mise run lint:js
      # Builds the SDK against the real reactor-wasm output above — the one thing
      # a local checkout without a Rust toolchain can't verify.
      - run: mise run build:js
      - run: mise run test:js

  js-integration-tests:
    name: JS SDK integration tests (real browser, real model)
    needs: changes
    # GitHub withholds repo secrets from a fork's pull_request runs, so a
    # fork PR could never populate INTEGRATION_TESTS_REACTOR_API_KEY —
    # skipped there rather than failing every external contribution. Still
    # runs for every same-repo PR and on push, same as before.
    if: github.event_name == 'push' || (needs.changes.outputs.js == 'true' && github.event.pull_request.head.repo.full_name == github.repository)
    # No cross-workflow lock against reactor/echo's shared session-creation
    # quota (there used to be one — a `reactor-echo-live-session-quota-<sha>`
    # environment referenced here and by every release-*.yml integration
    # job for the same commit, which GitHub queues arbitrarily deep instead
    # of cancelling past a `concurrency:` group's one-running/one-pending
    # limit. Dropped because it left a permanent, never-cleaned-up
    # environment per commit for no ongoing benefit — see below).
    #
    # Each suite paces its own session creation to ~86/min (see
    # conftest.py/fixtures.cpp/this suite's own harness), so the worst case —
    # a push touching crates/** firing ci.yml plus all three release-*.yml
    # workflows at once, 4 simultaneous same-commit claimants — sums to
    # ~344/min, comfortably under the 500/min quota (raised from 100, itself
    # raised from 10). A commit/PR racing an unrelated one is accepted the
    # same as before: paced_connect()'s own retry-on-429 covers that
    # residual case.
    #
    # EXPERIMENT (REA CI speed review): this used to also feed a js -> python
    # -> cpp -> swift `needs:` chain inside this one workflow, purely to keep
    # reactor/echo's live session load down to one suite at a time — a much
    # stricter constraint than the quota math above actually requires now.
    # That chain is removed here (python/cpp/swift-integration-tests all now
    # depend on just `changes`) to see how 4-5 suites hitting reactor/echo
    # genuinely concurrently behaves in practice. Known risk: reactor/echo
    # has an unrelated, still-open capacity issue (429 "no available
    # servers", isolated to echo's model-server pool, not this quota) that
    # concurrent load could make more visible. If this run trips that a lot
    # more than the sequential chain did, that is itself the answer and the
    # chain should come back — the self-pacing math was never the part in
    # doubt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: true
          # See the js job's cache-shared-key comment above.
          cache-shared-key: reactor-wasm-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # See the js job's comment above — same download, same flake risk.
      - name: Cache wasm-pack's wasm-opt/binaryen download
        uses: actions/cache@v4
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-binaryen-${{ hashFiles('mise.lock') }}
      # test:js:integration-tests builds wasm + dist/ itself (mise.toml)
      # rather than reusing the `js` job's — same reasoning as
      # release-js.yml's build job: never test something that wasn't built
      # by the exact steps that just ran.
      - name: Integration tests (Playwright, real browser + real model)
        env:
          # A dedicated secret, not the general REACTOR_API_KEY examples use —
          # this key exists only to run this suite.
          INTEGRATION_TESTS_REACTOR_API_KEY: ${{ secrets.INTEGRATION_TESTS_REACTOR_API_KEY }}
        run: mise run test:js:integration-tests

  cpp:
    name: C++ SDK
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          cache-on-failure: true
          # See the rust job's cache-shared-key comment above.
          cache-shared-key: reactor-host-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      # Catch2 (compiled, not header-only) and nlohmann/json are fetched and
      # built into build/_deps by CMake's FetchContent on every run otherwise
      # — cached here, keyed on the two CMakeLists.txt that declare them, so a
      # pin bump is a cache miss and everything else is a hit.
      - name: Cache CMake FetchContent dependencies (Catch2, nlohmann/json)
        uses: actions/cache@v4
        with:
          path: sdks/cpp/build/_deps
          key: cpp-deps-${{ hashFiles('sdks/cpp/CMakeLists.txt', 'sdks/cpp/tests/CMakeLists.txt') }}
      # Sets CXX to the pinned conda clang++, which the step below needs and the
      # ones after it must not use.
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      - name: Build libreactor_ffi (the library the SDK links)
        run: mise run build:ffi
      # The pinned clang++ exists only to compile that glue against libwebrtc's
      # own libc++ headers. It also brings conda's linker and sysroot, which
      # cannot resolve the GLIBC_2.34 symbols the .so it just produced needs from
      # the system glibc — so the SDK is built with the runner's own clang,
      # against the same libc as everything else it links.
      #
      # By absolute path, not `command -v clang++`: mise puts the conda toolchain
      # on PATH, so looking the name up finds the very compiler being avoided.
      #
      # clang rather than g++ because clang-tidy asks $CXX where the compiler
      # keeps its builtin headers and only clang answers — and with
      # REACTOR_REQUIRE_CLANG_TIDY set, a host that cannot answer fails the job
      # instead of quietly skipping the check.
      - name: Use the platform clang for the SDK itself
        run: |
          set -euo pipefail
          if [ ! -x /usr/bin/clang++ ]; then
            echo "::error::/usr/bin/clang++ is missing on this runner image."
            exit 1
          fi
          echo "CXX=/usr/bin/clang++" >> "$GITHUB_ENV"
          echo "REACTOR_REQUIRE_CLANG_TIDY=1" >> "$GITHUB_ENV"
          /usr/bin/clang++ --version
      # Fetches nlohmann/json and Catch2 at configure time.
      - run: mise run lint:cpp
      - run: mise run test:cpp

  cpp-integration-tests:
    name: C++ SDK integration tests (real FFI, real model)
    # No longer chained onto python-integration-tests — see
    # js-integration-tests' comment (the experiment this is part of).
    needs: changes
    # Same fork-PR reasoning as the other two integration jobs: GitHub
    # withholds repo secrets from a fork's pull_request runs, so
    # INTEGRATION_TESTS_REACTOR_API_KEY would never be populated there —
    # skipped rather than failing every external contribution. Still runs for
    # every same-repo PR and on push.
    if: github.event_name == 'push' || (needs.changes.outputs.cpp == 'true' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: true
          # See the rust job's cache-shared-key comment above.
          cache-shared-key: reactor-host-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      # See the cpp job's comment above — same fetch, its own build dir
      # (build-integration-tests, not build/) so its own cache.
      - name: Cache CMake FetchContent dependencies (Catch2)
        uses: actions/cache@v4
        with:
          path: sdks/cpp/build-integration-tests/_deps
          key: cpp-integration-deps-${{ hashFiles('sdks/cpp/CMakeLists.txt', 'sdks/cpp/integration-tests/CMakeLists.txt') }}
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      - name: Build libreactor_ffi (the library the SDK links)
        run: mise run build:ffi
      # Same two-compiler split as the `cpp` job above: the conda clang++ just
      # built libreactor_ffi's libwebrtc glue, but the SDK itself (and this
      # suite) must link against the runner's own glibc — switching before
      # `build:ffi` above, instead of after, reproduced the exact ABI mismatch
      # `mise run build:ffi` exists to avoid, since test:cpp:integration-tests
      # does not build the FFI itself for that same reason.
      - name: Use the platform clang for the SDK itself
        run: |
          set -euo pipefail
          if [ ! -x /usr/bin/clang++ ]; then
            echo "::error::/usr/bin/clang++ is missing on this runner image."
            exit 1
          fi
          echo "CXX=/usr/bin/clang++" >> "$GITHUB_ENV"
      - name: Integration tests (real FFI client, real model)
        env:
          # A dedicated secret, not the general REACTOR_API_KEY examples use —
          # this key exists only to run this suite (shared with
          # js-integration-tests/python-integration-tests).
          INTEGRATION_TESTS_REACTOR_API_KEY: ${{ secrets.INTEGRATION_TESTS_REACTOR_API_KEY }}
        run: mise run test:cpp:integration-tests

  swift-integration-tests:
    name: Swift SDK integration tests (real FFI, real model)
    # No longer chained onto cpp-integration-tests, and the
    # reactor-echo-live-session-quota concurrency group that used to serialize
    # this with swift-integration-tests-ios-simulator is gone too — both were
    # leftover from before self-pacing (~86/min/suite) made that manual
    # serialization unnecessary; main dropped the equivalent lock for
    # js/python/cpp back in PR #149 but this job never got reconciled to
    # match. See js-integration-tests' comment for the parallelization
    # experiment this is now part of.
    needs: changes
    if: github.event_name == 'push' || (needs.changes.outputs.swift == 'true' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    env:
      REACTOR_REQUIRE_SWIFT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: true
          cache-key: ${{ hashFiles('mise.lock') }}
          cache-shared-key: reactor-swift-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Build libreactor_ffi (the library the tests link)
        run: mise run build:ffi
      - name: Swift SDK integration tests (real FFI, real model)
        env:
          # Same dedicated secret js/python/cpp-integration-tests use.
          INTEGRATION_TESTS_REACTOR_API_KEY: ${{ secrets.INTEGRATION_TESTS_REACTOR_API_KEY }}
        run: mise run test:swift:integration-tests

  swift-integration-tests-ios-simulator:
    name: Swift SDK integration tests (iOS Simulator, real FFI, real model)
    # No longer chained after swift-integration-tests, and the shared
    # concurrency group with it is gone too — see that job's own comment.
    # Runs concurrently with swift-integration-tests itself now, not just
    # with the other bindings' suites.
    needs: changes
    if: github.event_name == 'push' || (needs.changes.outputs.swift == 'true' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    env:
      # Prunes the one target triple this job builds after copying its
      # archive out — cheap insurance on disk, though with only one slice
      # (see below) it is no longer the 13-GB-across-4-slices concern
      # swift-package's own job has.
      REACTOR_XCFRAMEWORK_PRUNE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: true
          cache-key: ${{ hashFiles('mise.lock') }}
          # Its own key, not swift-package's reactor-swift-xcframework-<hash>:
          # that job builds all 4 slices, this one only 1 (see below) — sharing
          # a key would mean whichever job's cache save runs last overwrites
          # the other's with a mismatched shape.
          cache-shared-key: reactor-swift-xcframework-ios-sim-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      # test:swift:integration-tests:ios-simulator depends on
      # build:xcframework:ios-simulator-only (mise.toml), not the full
      # build:xcframework swift-package uses: this suite only ever runs
      # xcodebuild against a Simulator destination (see swift.sh's own
      # comment on it), so building the macOS and iOS-device slices too —
      # each its own cargo build plus a multi-GB libwebrtc-prebuilt download —
      # would be pure waste here. One line still does build-then-run, same
      # reasoning as swift-package's own single-line job.
      - name: Swift SDK integration tests, iOS Simulator (real FFI, real model)
        env:
          INTEGRATION_TESTS_REACTOR_API_KEY: ${{ secrets.INTEGRATION_TESTS_REACTOR_API_KEY }}
          # Package.swift's binaryTarget resolves to this archive rather than
          # the dev (REACTOR_SWIFT_DEV) or released shape — the whole point:
          # xcodebuild picks the right slice per destination on its own.
          # Relative to the package root, not absolute: SwiftPM requires that
          # for a local binaryTarget path and refuses an absolute one outright.
          REACTOR_XCFRAMEWORK: target/xcframework/ReactorFFI.xcframework
        run: mise run test:swift:integration-tests:ios-simulator

  swift:
    name: Swift SDK
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.swift == 'true'
    # The only macOS job in this workflow, and the only place it could run: the
    # SDK targets macOS and iOS, and swift-format comes from the runner's Xcode.
    runs-on: macos-latest
    env:
      # Turns "no Swift toolchain, skipping" into a failure. scripts/swift.sh
      # skips off a machine without one so `mise run lint` stays usable on
      # Linux; here a skip would be a gate that quietly checks nothing.
      REACTOR_REQUIRE_SWIFT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          cache-on-failure: true
          cache-key: ${{ hashFiles('mise.lock') }}
          # Shared with swift-integration-tests below: both build reactor-ffi
          # for the same macOS host target, and `cache-key` only decorates the
          # per-job key — `cache-shared-key` is the input that actually pools a
          # cache across jobs (see #152's own investigation into this same gap
          # on the rust/python/cpp jobs).
          cache-shared-key: reactor-swift-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      # Recorded rather than assumed: the Swift version and the swift-format it
      # carries are the runner's Xcode, which is what this job pins in practice.
      - name: Record the toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          "$(xcrun --find swift-format)" --version
      # No setup-libwebrtc-cxx here, unlike the Python and C++ jobs: that action
      # exists to hand Linux a clang new enough for libwebrtc's bundled libc++
      # headers, and is a documented no-op off Linux. macOS builds the glue
      # against the platform libc++, which already matches its toolchain.
      - name: Build libreactor_ffi (the library the tests link)
        run: mise run build:ffi
      - run: mise run lint:swift
      - run: mise run build:swift
      # The only thing in this pipeline that compiles the `#if os(iOS)` code.
      # Libraries only and no link step, so it costs a compile rather than an
      # XCFramework build.
      - run: mise run build:swift:ios
      - run: mise run test:swift

  swift-package:
    name: Swift XCFramework
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.swift_package == 'true'
    runs-on: macos-latest
    env:
      # Keep one target triple's build tree at a time. Four of them come to about
      # 13 GB — the iOS device triple alone is 8 GB — and a macOS runner has
      # roughly 14 GB free.
      REACTOR_XCFRAMEWORK_PRUNE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          cache-on-failure: true
          cache-key: ${{ hashFiles('mise.lock') }}
          # Shared with swift-integration-tests-ios-simulator below: both
          # cross-compile the full four-slice XCFramework, so pooling this
          # cache is worth far more here than on the plain macOS-host jobs —
          # see the swift job's own comment on cache-shared-key vs cache-key.
          cache-shared-key: reactor-swift-xcframework-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      # One step, not two: test:swift:package `depends` on build:xcframework, and
      # a separate `mise run build:xcframework` line before it would be a second
      # mise invocation rather than a cache hit — the build task declares no
      # sources/outputs, so mise has no freshness rule to skip it with, and all
      # four slices (minutes, ~13 GB of build tree) would be built twice.
      #
      # So this one line does both: builds every slice, links an iOS dylib
      # against exactly the framework list Package.swift declares — the only
      # thing that catches a framework missing from it, since a static library
      # links nothing and the failure would otherwise land in a consumer's app —
      # then consumes the result from a throwaway package, moves the tree, and
      # builds and runs again.
      - run: mise run test:swift:package

  kotlin:
    name: Kotlin SDK (JVM + Android)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install Android build packages
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - run: mise run lint:kotlin
      - run: mise run build:kotlin
      - run: mise run test:kotlin

  kotlin-android:
    name: Kotlin SDK (Android instrumentation scaffold)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # This exercises the Android test runner, not a native ABI. K02 adds
      # arm64 device coverage once the WebRTC bootstrap has been proved.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: mise run test:kotlin:android

  ci-complete:
    name: CI Complete
    needs:
      [
        changes,
        repo,
        rust,
        python,
        python-integration-tests,
        js,
        js-integration-tests,
        cpp,
        kotlin,
        kotlin-android,
        cpp-integration-tests,
        swift,
        swift-integration-tests,
        swift-integration-tests-ios-simulator,
        swift-package,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A skipped job is a pass: that is the whole point of the filters above, and
      # what makes this the only check `main` needs to require. A *failed* or
      # cancelled one is not, whichever job it was.
      - name: Verify no job failed
        run: |
          for r in "${{ needs.changes.result }}" \
                   "${{ needs.repo.result }}" \
                   "${{ needs.rust.result }}" \
                   "${{ needs.python.result }}" \
                   "${{ needs.python-integration-tests.result }}" \
                   "${{ needs.js.result }}" \
                   "${{ needs.js-integration-tests.result }}" \
                   "${{ needs.cpp.result }}" \
                   "${{ needs.kotlin.result }}" \
                   "${{ needs.kotlin-android.result }}" \
                   "${{ needs.cpp-integration-tests.result }}" \
                   "${{ needs.swift.result }}" \
                   "${{ needs.swift-integration-tests.result }}" \
                   "${{ needs.swift-integration-tests-ios-simulator.result }}" \
                   "${{ needs['swift-package'].result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job failed ($r)"; exit 1
            fi
          done
          echo "All CI checks passed."
