name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_VERSION: "2026.8.8"    # pinned; must be >= mise.toml min_version
  # Workflow-level so every step (mise-action AND the `mise run` steps) sees it.
  MISE_LOCKED: "1"            # install/run only mise.lock versions; never float
  # CI installs the Rust toolchain via actions-rust-lang/setup-rust-toolchain
  # (reads rust-toolchain.toml). Disable mise's rust/rustup so the action owns it.
  # That action also exports RUSTFLAGS="-D warnings" - kept on purpose: warnings
  # are errors in CI.
  MISE_DISABLE_TOOLS: "rust,rustup,aqua:rust-lang/rustup"

jobs:
  lint:
    name: fmt + clippy + repo lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # mise.lock drift check diffs against the merge-base
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          cache-on-failure: true
          # Keyed on the toolchain lockfile because the Rust cache holds C++
          # objects: reactor-webrtc-sys compiles its glue with the clang mise
          # pins, and reusing objects built by a different one is the ABI
          # mismatch its build.rs warns about — silently, since Cargo's
          # fingerprint does not see the compiler swap. A tool bump is a cache
          # miss now, which is the safe direction.
          cache-key: ${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/setup-node@v4   # Node isn't mise-pinned yet; see mise.toml's "JS SDK" section
        with:
          node-version: "24"
      - run: hk validate
      - run: mise run fmt:check
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      # Covers reactor-ffi, which is why the clang above is needed.
      - run: mise run clippy
      - run: mise run lint:python
      - run: mise run lint:js
      - name: ABI parity (lib.rs / reactor_ffi.h / _ffi.py)
        run: mise run lint:abi
      - run: mise run lint:shell
      - run: mise run lint:mise-tools-root
      - name: mise.lock drift (vs merge-base)
        run: mise run lint:mise-lock

  wasm:
    name: browser binding (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml,
        with:                                            # including the wasm32 target
          cache-on-failure: true
          cache-key: ${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      # reactor-wasm compiles to nothing off a wasm target, so the lint job's
      # host-target clippy covers none of it. No clang needed here: this target
      # pulls in reactor-core only, never reactor-ffi's libwebrtc glue.
      - run: mise run clippy:wasm
      # Proves the binding still links and that wasm-bindgen can emit the JS
      # package the SDK imports — a clippy pass alone would not.
      - run: mise run build:wasm
      - uses: actions/setup-node@v4   # Node isn't mise-pinned yet; see mise.toml's "JS SDK" section
        with:
          node-version: "24"
      # Builds the JS SDK against the real reactor-wasm output above — the
      # one thing a local checkout without a Rust toolchain can't verify.
      - run: mise run build:js

  test:
    name: rust + python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          cache-on-failure: true
          # Keyed on the toolchain lockfile because the Rust cache holds C++
          # objects: reactor-webrtc-sys compiles its glue with the clang mise
          # pins, and reusing objects built by a different one is the ABI
          # mismatch its build.rs warns about — silently, since Cargo's
          # fingerprint does not see the compiler swap. A tool bump is a cache
          # miss now, which is the safe direction.
          cache-key: ${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install clang for the libwebrtc C++ glue
        uses: ./.github/actions/setup-libwebrtc-cxx
      - run: mise run test:rust
      # Builds the cdylib so the ctypes contract tests run instead of skipping —
      # they are the only check that _ffi.py's argtypes match the compiled ABI.
      - name: Build libreactor_ffi for the ctypes contract tests
        run: cargo build -p reactor-ffi --release
      - run: mise run test:python

  ci-complete:
    name: CI Complete
    needs: [lint, wasm, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          for r in "${{ needs.lint.result }}" "${{ needs.wasm.result }}" "${{ needs.test.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job failed ($r)"; exit 1
            fi
          done
          echo "All CI checks passed."
