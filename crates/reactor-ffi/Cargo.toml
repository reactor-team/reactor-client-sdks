[package]
name        = "reactor-ffi"
description = "C ABI shared library — bridges reactor-core to native language SDKs via a stable C interface"
version.workspace   = true
edition.workspace   = true
license.workspace   = true
repository.workspace = true

[lib]
name       = "reactor_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
reactor-core   = { workspace = true, features = ["tokio-platform"] }
reactor-webrtc = { workspace = true }
async-trait    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
futures        = { workspace = true }
log            = { workspace = true }
env_logger     = { workspace = true }
mime_guess     = { workspace = true }
tokio          = { workspace = true }

# TLS is pure Rust on every platform. Two reasons, and the mobile targets have
# always had the first one:
#
# 1. libwebrtc bundles BoringSSL. Linking OpenSSL beside it puts two forks of the
#    same library in one process, which is a well-known source of symbol conflicts.
#    rustls's crypto provider uses prefixed symbols, so it does not collide.
# 2. Packaging. On Linux, native-tls means OpenSSL, which auditwheel then vendors
#    into every wheel — shipping a pinned copy of OpenSSL that we would own the
#    patching of. With rustls there is nothing to vendor.
#
# Desktop uses the platform trust store rather than bundled roots, because it is
# replacing native-tls, which did too: switching to webpki-roots would silently stop
# trusting enterprise CAs and break anyone behind a MITM proxy.

[target.'cfg(target_os = "ios")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jni     = "0.21"

# Desktop also gets http2/stream/charset.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "charset", "rustls-tls-native-roots"] }
