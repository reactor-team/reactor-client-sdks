[workspace]
members = [
    "crates/reactor-protocol",
    "crates/reactor-core",
    "crates/reactor-ffi",
    "crates/reactor-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/reactor-team/reactor-client-sdks"

[workspace.dependencies]
reactor-protocol = { path = "crates/reactor-protocol" }
reactor-core     = { path = "crates/reactor-core" }
reactor-wasm     = { path = "crates/reactor-wasm" }
# 0.15: the stats report says which stream is which, and carries the candidate
# pair's identity and counters — `kind`, `nominated`, `local_candidate_type`,
# the available-bitrate estimates and the frame counters, all of which
# `crates/reactor-core/src/stats.rs` needs to answer what the browser SDK
# answers (REA-6019). It also stops narrowing three 64-bit packet counters, and
# revives the send-path RTT that had been a hard 0.0 since M7907.
#
# 0.12: the trailer carries the capture time the caller declared, rather than the
# instant the engine pushed the frame, and the field is named `capture_time_us`
# for it (reactor-webrtc #64). 0.10 brought the outbound push that accepts a
# capture time in the first place (#53); 0.11 is additive.
reactor-webrtc   = "0.15"

serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
async-trait = "0.1"
futures     = "0.3"
log         = "0.4"
env_logger  = { version = "0.11", default-features = false, features = ["auto-color"] }
mime_guess  = "2"
tokio       = { version = "1", features = ["full"] }
prost       = "0.13"
prost-types = "0.13"
