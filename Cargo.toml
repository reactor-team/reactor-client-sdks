[workspace]
members = [
    "crates/reactor-protocol",
    "crates/reactor-core",
    "crates/reactor-ffi",
    "crates/reactor-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/reactor-team/reactor-client-sdks"

[workspace.dependencies]
reactor-protocol = { path = "crates/reactor-protocol" }
reactor-core     = { path = "crates/reactor-core" }
reactor-wasm     = { path = "crates/reactor-wasm" }
# 0.10: `push_video_frame_with_metadata_at` — the outbound push that takes the
# caller's capture time (reactor-webrtc #53). 0.8/0.9 are additive too (codec
# preferences, awaitable set_track), so nothing here changed shape.
reactor-webrtc   = "0.10"

serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
async-trait = "0.1"
futures     = "0.3"
log         = "0.4"
env_logger  = { version = "0.11", default-features = false, features = ["auto-color"] }
mime_guess  = "2"
tokio       = { version = "1", features = ["full"] }
prost       = "0.13"
prost-types = "0.13"
