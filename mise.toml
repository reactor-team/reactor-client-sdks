# mise is the task runner + toolchain manager.
# Run `mise install` to install pinned tools, `mise run <task>` to run tasks.
# `mise lock` refreshes the committed mise.lock.
# 2026.8.8 floor: older mise resolves conda: tools but writes no linux-x64 entry
# for them into mise.lock, and linux-x64 is where CI runs — `lint:mise-lock`
# fails on the gap. The clang pin below is the tool that needs it.
min_version = "2026.8.8"
monorepo_root = true

[tools]
# THE ONLY [tools] TABLE IN THE REPO. Every entry is exact-pinned + locked.
#
# cargo-binstall (aqua-backed prebuilt) MUST be present so the cargo: backend
# installs cargo-nextest as a prebuilt binary instead of compiling from source.
"aqua:cargo-bins/cargo-binstall" = "1.21.0"
"cargo:cargo-nextest" = "0.9.140"
# clang++ for reactor-webrtc-sys's C++ glue. The prebuilt libwebrtc archive
# carries libc++ headers that track LLVM trunk, and a distro clang is generally
# too old to parse them — CI used to install one from apt.llvm.org, which is
# unpinned, unlocked, and once sat on a single step for half an hour. Here it is
# a tool like any other: exact-pinned, checksummed per platform in mise.lock, and
# restored from the cache the jobs already warm.
#
# Linux-only on purpose. macOS builds the glue against the platform libc++ and
# Windows against the MSVC STL, so both already match their toolchain — and this
# is a 426 MB install nobody on a laptop should pay for. `mise lock` still records
# every platform, so the lockfile gate stays honest.
"conda:clangxx" = { version = "21.1.8", os = ["linux"] }
# clang-format and clang-tidy for the C++ SDK, at the same LLVM version as the
# clangxx above — one toolchain, so the formatter a contributor runs is the one
# the gate runs. Unlike clangxx these are small and needed on every platform:
# `lint:cpp` is a formatting gate, and a gate checking a version nobody can
# install locally teaches people to push and hope.
"conda:clang-format" = "21.1.8"
"conda:clang-tools"  = "21.1.8"
# CMake + Ninja build the C++ SDK. Pinned rather than taken from PATH because a
# generator and a build system are exactly the things that differ between a
# laptop and a runner.
cmake = "4.4.2"
ninja = "1.13.2"
# wasm-pack builds crates/reactor-wasm into a loadable JS package.
"cargo:wasm-pack" = "0.15.0"
uv          = "0.11.31"
ruff        = "0.15.22"
shellcheck  = "0.11.0"
# hk drives git hooks (pre-commit / pre-push / post-checkout).
hk          = "1.52.0"
# gitleaks scans the repo for committed secrets (lint:secrets).
"aqua:gitleaks/gitleaks" = "8.30.1"
# EXCEPTION: rustup may be "latest" — it is the installer, not the compiler.
# The toolchain (channel / components / targets) is pinned by rust-toolchain.toml.
# CI never uses mise's rustup (MISE_DISABLE_TOOLS + actions-rust-lang/setup-rust-toolchain).
"aqua:rust-lang/rustup" = "latest"

[settings]
experimental = true
lockfile = true
lockfile_platforms = ["macos-arm64", "macos-x64", "linux-x64", "linux-arm64"]
idiomatic_version_file_enable_tools = ["rust"]
task.source_freshness_hash_contents = true

[env]
REPO_ROOT = "{{ env.REPO_ROOT | default(value=config_root) }}"

# ── Rust ──────────────────────────────────────────────────────────────────────

[tasks.fmt]
description = "[Format] Format all Rust code"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "[Format] Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "[Build] cargo check the workspace"
run = "cargo check --workspace"

[tasks.clippy]
description = "[Quality] Clippy with warnings denied"
# Covers reactor-ffi. Nothing needs a local WebRTC checkout: reactor-webrtc-sys
# auto-detects the host triple and downloads the prebuilt libwebrtc into OUT_DIR.
#
# It does still compile the C++ glue, and on Linux that happens against the
# libwebrtc archive's own trunk libc++ headers (`-nostdinc++`), which the distro
# clang++ is generally too old to parse. macOS uses the platform libc++ and needs
# nothing. On Linux, set CXX to a recent clang++ — see the CI workflow.
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."check:wasm"]
description = "[Build] cargo check reactor-wasm for the browser target"
run = "cargo check -p reactor-wasm --target wasm32-unknown-unknown"

[tasks."clippy:wasm"]
description = "[Quality] Clippy reactor-wasm for the browser target"
# reactor-wasm compiles to nothing off a wasm target (see its lib.rs), so the
# host-target `clippy` above lints none of it. This is the run that does.
run = "cargo clippy -p reactor-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings"

[tasks."build:wasm"]
description = "[Build] Build the browser binding into crates/reactor-wasm/pkg"
# --target web: a native ES module, no bundler needed to load it. The JS SDK
# depends on the generated pkg/ directory.
run = """
wasm-pack build crates/reactor-wasm   --target web   --out-dir pkg   --out-name reactor_wasm
"""

[tasks."test:rust"]
description = "[Testing] Rust workspace tests via nextest + doctests"
run = [
    "cargo nextest run --workspace --no-tests=pass",
    "cargo test --workspace --doc",
]

# ── Python SDK ────────────────────────────────────────────────────────────────

[tasks."fmt:python"]
description = "[Format] Format the Python SDK with ruff"
dir = "sdks/python"
run = "ruff format ."

[tasks."lint:python"]
description = "[Quality] Lint + format-check the Python SDK with ruff"
dir = "sdks/python"
# compileall covers the examples: ruff parses them, but only a compile catches a
# `python examples/…` that would die on the first line. Importing them would be
# the stronger check and needs the native library, which this task does not build
# — the ctypes contract tests in `test:python` are where that is covered.
run = [
    "ruff check .",
    "ruff format --check .",
    "python3 -m compileall -q examples/*.py",
]

[tasks."build:wheel"]
description = "[Build] Build the Python SDK wheel with libreactor_ffi bundled"
dir = "sdks/python"
# Needs a release build of the FFI to bundle; without one hatch_build.py falls back
# to a pure wheel and says so. Override the binary with REACTOR_FFI_LIB, or the
# platform tag with REACTOR_WHEEL_PLATFORM_TAG.
run = [
    "cargo build -p reactor-ffi --release",
    "uv build --wheel --out-dir dist",
]

[tasks."test:python"]
description = "[Testing] Python SDK tests via pytest"
dir = "sdks/python"
# --locked: resolve strictly from the committed uv.lock, matching MISE_LOCKED=1.
# Tests needing the compiled dylib skip themselves when it is absent.
run = "uv run --group dev --locked pytest"

[tasks."test:python:integration-tests"]
description = "[Testing] Python SDK integration tests — real FFI client, real WebRTC, against a live model (needs INTEGRATION_TESTS_REACTOR_API_KEY)"
dir = "sdks/python"
# Deliberately not a dependency of `test` / `test:python`: unlike the unit
# suite's faked `get_lib()`, this connects to a real model in production
# (reactor/echo by default — see integration-tests/conftest.py) over a real
# WebRTC connection, so it needs INTEGRATION_TESTS_REACTOR_API_KEY, costs
# real session time, and runs on the order of minutes rather than seconds.
run = [
    # The unit suite's dylib is optional (tests needing it skip without one);
    # this suite is nothing but live-session calls, so it needs a real build
    # rather than skipping quietly. Same command build:wheel uses, and same
    # reasoning as test:js:integration-tests's explicit sequential steps below.
    "cargo build -p reactor-ffi --release",
    # --only-rerun scopes retries to the live model's shared, per-minute
    # session-creation quota being transiently exhausted (RateLimitedError) —
    # the same tolerance sdks/js/integration-tests/playwright.config.ts gets
    # for free from Playwright's `retries: 1`. A real assertion failure is
    # never a RateLimitedError, so it still fails on the first try.
    "uv run --group dev --locked pytest integration-tests/tests -v --reruns 2 --reruns-delay 5 --only-rerun RateLimitedError",
]

[tasks.test]
description = "[Testing] Every test suite (Rust + Python + JS + C++)"
depends = ["test:rust", "test:python", "test:js", "test:cpp"]

# ── JS SDK ────────────────────────────────────────────────────────────────────
# Node/npm aren't in [tools] above yet — every task here just shells out to
# whatever `npm` is on PATH (see .github/workflows/ci.yml's `lint`, `wasm` and
# `test` jobs, which use actions/setup-node instead, matching how Rust is
# handled: an action owns the toolchain, mise stays out of its way).

[tasks."install:js"]
description = "[Setup] npm install the JS SDK"
dir = "sdks/js"
run = "npm install"

[tasks."lint:js"]
description = "[Quality] Lint + type-check the JS SDK"
dir = "sdks/js"
depends = ["install:js"]
run = [
    "npm run lint",
    "npm run type-check",
]

[tasks."test:js"]
description = "[Testing] JS SDK unit tests via vitest"
dir = "sdks/js"
depends = ["install:js"]
# Pure-JS unit tests against a mocked ReactorClient — no wasm build needed.
run = "npm run test"

[tasks."build:js"]
description = "[Build] Build the JS SDK to dist/ (needs build:wasm first)"
dir = "sdks/js"
depends = ["install:js"]
run = "npm run build"

[tasks."build:js:examples"]
description = "[Build] Smoke-build every JS SDK example against dist/"
depends = ["build:js"]
run = "scripts/build-js-examples.sh"

[tasks."install:js:integration-tests"]
description = "[Setup] npm install the JS SDK integration test harness"
dir = "sdks/js/integration-tests"
run = "npm install"

[tasks."test:js:integration-tests"]
description = "[Testing] JS SDK integration tests — real browser, real WebRTC, against a live model (needs INTEGRATION_TESTS_REACTOR_API_KEY)"
dir = "sdks/js/integration-tests"
depends = ["install:js:integration-tests"]
# Deliberately not a dependency of `test` / `test:js`: unlike the unit
# suite's mocked client, this connects to a real model in production
# (reactor/echo by default — see harness/vite.config.ts) over a real
# WebRTC connection, so it needs INTEGRATION_TESTS_REACTOR_API_KEY, costs
# real session time, and runs on the order of minutes rather than seconds.
run = [
    # `depends` runs its entries in parallel when they don't depend on each
    # other, and build:js's own copy-wasm step needs build:wasm's
    # crates/reactor-wasm/pkg output to already exist (its description says
    # so, but doesn't declare it as a real dependency) — a race, not a fix,
    # if these two were listed in `depends` instead. Explicit sequential
    # `mise run` steps here, same as every caller in ci.yml/release-js.yml
    # already does by hand, is what actually guarantees the order for the
    # documented local entry point (this task, run on its own from a clean
    # checkout).
    "mise run build:wasm",
    "mise run build:js",
    # This package's tsconfig.json is otherwise never run by anything —
    # Vite/Playwright only transpile, they don't type-check — so a type
    # error here would accumulate silently forever without this.
    "npx tsc --noEmit",
    "npx playwright install --with-deps chromium",
    "npx playwright test",
]

# ── C++ SDK ───────────────────────────────────────────────────────────────────
# Needs a release build of libreactor_ffi to link against; `build:cpp` makes one.
# Rebuild it after pulling changes under crates/ — reactor_abi_version() turns a
# stale library into a message instead of a hang, but only when the library on
# disk is the one you think it is.

[tasks."build:ffi"]
description = "[Build] Build libreactor_ffi in release mode (what the C++ SDK links)"
# Deliberately its own task, and deliberately not a dependency of `build:cpp`.
# On Linux this compiles reactor-webrtc-sys's C++ glue, which needs the pinned
# conda clang++ (see the CI action) — while the SDK itself must be built with the
# platform toolchain, because the conda one brings a sysroot whose glibc cannot
# resolve the symbols the resulting .so needs. Two compilers, two tasks, so
# neither run has to guess which is which.
run = "cargo build -p reactor-ffi --release"

[tasks."build:cpp"]
description = "[Build] Configure + build the C++ SDK and its examples (needs build:ffi first)"
run = [
    "cmake -S sdks/cpp -B sdks/cpp/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "cmake --build sdks/cpp/build",
]

[tasks."fmt:cpp"]
description = "[Format] Format the C++ SDK with clang-format"
# --others so a file that is new and not yet `git add`ed is formatted too. Plain
# `git ls-files` lists only tracked files, which means a new file is unformatted
# and unchecked until it is committed — a false green precisely when a file is
# most likely to need the check. --exclude-standard keeps ignored paths out.
run = "git ls-files --cached --others --exclude-standard 'sdks/cpp/**/*.[ch]pp' | xargs -r clang-format -i"

[tasks."fmt:cpp:check"]
description = "[Format] Check C++ SDK formatting with clang-format"
# Split out of lint:cpp because it needs nothing built and no network, which is
# what makes it usable from the pre-commit hook.
run = "git ls-files --cached --others --exclude-standard 'sdks/cpp/**/*.[ch]pp' | xargs -r clang-format --dry-run --Werror"

[tasks."lint:cpp"]
description = "[Quality] Format-check + clang-tidy the C++ SDK"
# clang-format needs nothing built. clang-tidy needs the compile database, hence
# the depends: it type-checks every translation unit, so it is a compile, not a
# lint over text. Finding a resource directory it can use is fiddly enough to
# live in a script — see scripts/clang-tidy-cpp.sh.
depends = ["build:cpp", "fmt:cpp:check"]
run = """
# tests/package is excluded because clang-tidy is handed this build's compile
# database and that fixture is not in it: it belongs to a separate project,
# configured against the *installed* package by test:cpp:package. Analysed
# without its own flags it parses as neither C++17 nor with an include path,
# which buries the real output under thousands of errors from inside libstdc++.
# A git pathspec glob matches across '/', hence the exclusion rather than a
# narrower pattern.
git ls-files --cached --others --exclude-standard \
    'sdks/cpp/src/**/*.cpp' 'sdks/cpp/tests/*.cpp' ':(exclude)sdks/cpp/tests/package/*' \
  | xargs -r scripts/clang-tidy-cpp.sh sdks/cpp/build
"""

[tasks."test:cpp:package"]
description = "[Testing] Install the C++ package, move it, and build a consumer against it"
# The steps live in a script for the reason clang-tidy's do: `run` is handed to
# /bin/sh, which on a Debian runner is dash and refuses `set -o pipefail`, and a
# gate whose failure mode differs between a laptop and CI is not a gate.
run = "scripts/cpp-package-check.sh"

[tasks."test:cpp"]
description = "[Testing] C++ SDK unit tests via ctest, and the installed package"
# test:cpp:package rides along rather than standing beside this in CI, because
# what CI runs for this binding is `test:cpp` — a guard listed anywhere it does
# not reach is a guard that only holds until someone forgets to run it.
depends = ["build:cpp", "test:cpp:package"]
run = "ctest --test-dir sdks/cpp/build --output-on-failure"

[tasks."test:cpp:integration-tests"]
description = "[Testing] C++ SDK integration tests — real FFI client, real WebRTC, against a live model (needs INTEGRATION_TESTS_REACTOR_API_KEY)"
# Deliberately not a dependency of `test` / `test:cpp`: unlike the unit
# suite's fake Ffi table, this connects to a real model in production
# (reactor/echo by default — see integration-tests/support.cpp) over a real
# WebRTC connection, so it needs INTEGRATION_TESTS_REACTOR_API_KEY, costs real
# session time, and runs on the order of minutes rather than seconds.
#
# A separate build directory (build-integration-tests, not build/), so this
# never shares a CMake cache with the REACTOR_SDK_BUILD_INTEGRATION_TESTS=OFF
# configuration `build:cpp`/`test:cpp` use — reconfiguring build/ with the flag
# flipped on would otherwise silently fold this suite into `ctest --test-dir
# sdks/cpp/build`, the same way test:python:integration-tests deliberately
# stays out of pytest's own default testpaths.
run = [
    "cargo build -p reactor-ffi --release",
    "cmake -S sdks/cpp -B sdks/cpp/build-integration-tests -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DREACTOR_SDK_BUILD_TESTS=OFF -DREACTOR_SDK_BUILD_EXAMPLES=OFF -DREACTOR_SDK_BUILD_INTEGRATION_TESTS=ON",
    "cmake --build sdks/cpp/build-integration-tests",
    "sdks/cpp/build-integration-tests/integration-tests/reactor_sdk_integration_tests",
]

# ── Lints ─────────────────────────────────────────────────────────────────────

[tasks."lint:abi"]
description = "[Quality] Verify lib.rs, reactor_ffi.h and _ffi.py declare the same ABI"
run = "python3 scripts/check-abi-parity.py"

[tasks."lint:error-codes"]
description = "[Quality] Verify every SDK declares a class for every error.rs code"
run = "python3 scripts/check-error-codes-parity.py"

[tasks."lint:mise-lock"]
description = "[Quality] Verify mise.lock covers every declared tool + lockfile platform"
run = "python3 scripts/check-mise-lock.py"

[tasks."lint:mise-tools-root"]
description = "[Quality] Enforce a single root [tools] table (no module-declared tools)"
run = "python3 scripts/check-mise-tools-root.py"

[tasks."lint:shell"]
description = "[Quality] Lint shell scripts with shellcheck"
run = "git ls-files '*.sh' | xargs -r shellcheck --shell=bash"

# Scans tracked files' full git history for committed secrets (API keys,
# tokens, private keys, ...). Repo-wide rather than per-binding: a leaked
# credential doesn't care which language it's next to.
[tasks."lint:secrets"]
description = "[Quality] Scan git history for committed secrets"
run = "gitleaks detect --source . --no-banner --redact -v"

[tasks.lint]
description = "[Quality] Run all linters"
depends = [
    "fmt:check",
    "clippy",
    "clippy:wasm",
    "lint:python",
    "lint:js",
    "lint:cpp",
    "lint:abi",
    "lint:error-codes",
    "lint:shell",
    "lint:secrets",
    "lint:mise-tools-root",
    "lint:mise-lock",
]

[tasks.ci]
description = "[Quality] Everything CI runs"
depends = ["lint", "test"]

# ── Setup ─────────────────────────────────────────────────────────────────────

[tasks.install-hooks]
description = "[Setup] Install git hooks via hk"
run = "hk install --mise"

[tasks.uninstall-hooks]
description = "[Setup] Remove hk-managed git hooks"
run = "hk uninstall"
