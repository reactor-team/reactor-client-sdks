# mise is the task runner + toolchain manager.
# Run `mise install` to install pinned tools, `mise run <task>` to run tasks.
# `mise lock` refreshes the committed mise.lock.
# 2026.8.8 floor: older mise resolves conda: tools but writes no linux-x64 entry
# for them into mise.lock, and linux-x64 is where CI runs — `lint:mise-lock`
# fails on the gap. The clang pin below is the tool that needs it.
min_version = "2026.8.8"
monorepo_root = true

[tools]
# THE ONLY [tools] TABLE IN THE REPO. Every entry is exact-pinned + locked.
#
# cargo-binstall (aqua-backed prebuilt) MUST be present so the cargo: backend
# installs cargo-nextest as a prebuilt binary instead of compiling from source.
"aqua:cargo-bins/cargo-binstall" = "1.21.0"
"cargo:cargo-nextest" = "0.9.140"
# clang++ for reactor-webrtc-sys's C++ glue. The prebuilt libwebrtc archive
# carries libc++ headers that track LLVM trunk, and a distro clang is generally
# too old to parse them — CI used to install one from apt.llvm.org, which is
# unpinned, unlocked, and once sat on a single step for half an hour. Here it is
# a tool like any other: exact-pinned, checksummed per platform in mise.lock, and
# restored from the cache the jobs already warm.
#
# Linux-only on purpose. macOS builds the glue against the platform libc++ and
# Windows against the MSVC STL, so both already match their toolchain — and this
# is a 426 MB install nobody on a laptop should pay for. `mise lock` still records
# every platform, so the lockfile gate stays honest.
"conda:clangxx" = { version = "21.1.8", os = ["linux"] }
# clang-format and clang-tidy for the C++ SDK, at the same LLVM version as the
# clangxx above — one toolchain, so the formatter a contributor runs is the one
# the gate runs. Unlike clangxx these are small and needed on every platform:
# `lint:cpp` is a formatting gate, and a gate checking a version nobody can
# install locally teaches people to push and hope.
"conda:clang-format" = "21.1.8"
"conda:clang-tools"  = "21.1.8"
# CMake + Ninja build the C++ SDK. Pinned rather than taken from PATH because a
# generator and a build system are exactly the things that differ between a
# laptop and a runner.
cmake = "4.4.2"
ninja = "1.13.2"
# wasm-pack builds crates/reactor-wasm into a loadable JS package.
"cargo:wasm-pack" = "0.15.0"
# cargo-ndk cross-compiles reactor-ffi for Android. It is what knows how to point
# cargo at the NDK's clang for a given ABI and API level, which is otherwise a
# hand-written linker path per target in .cargo/config.toml — one more place for
# the NDK version to be written down and drift from sdks/android/sdk-packages.txt.
"cargo:cargo-ndk" = "4.1.2"
# The JDK and Gradle build the Java SDK. Both pinned here rather than taken from
# PATH or from a Gradle wrapper: a wrapper is a second, unlocked source of truth
# for a toolchain version, and this table is deliberately the only one. `java` is
# the *build* JDK — the SDK compiles to release 22, which is where the Foreign
# Function & Memory API stopped being a preview feature, and CI also runs the
# suite on a 22 runtime so that floor is a tested claim rather than a flag.
java   = "temurin-25.0.4+7.0.LTS"
gradle = "9.7.1"
# The Android command-line tools — sdkmanager itself. Pinned here like every other
# toolchain rather than taken from a runner image's preinstalled ANDROID_HOME, which
# is whatever that image shipped that week. The plugin resolves one archive per
# OS/arch out of Google's repository2-3.xml.
#
# It installs *only* cmdline-tools. The SDK components it then fetches — the
# platform, the build-tools and the NDK — are sdkmanager's, and mise has no view of
# them: they are pinned in sdks/android/sdk-packages.txt and installed by
# scripts/setup-android-sdk.sh, which verifies the installed set matches that file.
# That split is the one exception to "[tools] is the only place a version lives",
# and it exists because mise cannot express the other half.
"android-sdk" = "23.0"
uv          = "0.11.31"
ruff        = "0.15.22"
shellcheck  = "0.11.0"
# hk drives git hooks (pre-commit / pre-push / post-checkout).
hk          = "1.52.0"
# gitleaks scans the repo for committed secrets (lint:secrets).
"aqua:gitleaks/gitleaks" = "8.30.1"
# EXCEPTION: rustup may be "latest" — it is the installer, not the compiler.
# The toolchain (channel / components / targets) is pinned by rust-toolchain.toml.
# CI never uses mise's rustup (MISE_DISABLE_TOOLS + actions-rust-lang/setup-rust-toolchain).
"aqua:rust-lang/rustup" = "latest"

[settings]
experimental = true
lockfile = true
lockfile_platforms = ["macos-arm64", "macos-x64", "linux-x64", "linux-arm64"]
idiomatic_version_file_enable_tools = ["rust"]
task.source_freshness_hash_contents = true

[env]
REPO_ROOT = "{{ env.REPO_ROOT | default(value=config_root) }}"

# ── Rust ──────────────────────────────────────────────────────────────────────

[tasks.fmt]
description = "[Format] Format all Rust code"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "[Format] Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "[Build] cargo check the workspace"
run = "cargo check --workspace"

[tasks.clippy]
description = "[Quality] Clippy with warnings denied"
# Covers reactor-ffi. Nothing needs a local WebRTC checkout: reactor-webrtc-sys
# auto-detects the host triple and downloads the prebuilt libwebrtc into OUT_DIR.
#
# It does still compile the C++ glue, and on Linux that happens against the
# libwebrtc archive's own trunk libc++ headers (`-nostdinc++`), which the distro
# clang++ is generally too old to parse. macOS uses the platform libc++ and needs
# nothing. On Linux, set CXX to a recent clang++ — see the CI workflow.
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."check:wasm"]
description = "[Build] cargo check reactor-wasm for the browser target"
run = "cargo check -p reactor-wasm --target wasm32-unknown-unknown"

[tasks."clippy:wasm"]
description = "[Quality] Clippy reactor-wasm for the browser target"
# reactor-wasm compiles to nothing off a wasm target (see its lib.rs), so the
# host-target `clippy` above lints none of it. This is the run that does.
run = "cargo clippy -p reactor-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings"

[tasks."build:wasm"]
description = "[Build] Build the browser binding into crates/reactor-wasm/pkg"
# --target web: a native ES module, no bundler needed to load it. The JS SDK
# depends on the generated pkg/ directory.
run = """
wasm-pack build crates/reactor-wasm   --target web   --out-dir pkg   --out-name reactor_wasm
"""

[tasks."test:rust"]
description = "[Testing] Rust workspace tests via nextest + doctests"
run = [
    "cargo nextest run --workspace --no-tests=pass",
    "cargo test --workspace --doc",
]

# ── Python SDK ────────────────────────────────────────────────────────────────

[tasks."fmt:python"]
description = "[Format] Format the Python SDK with ruff"
dir = "sdks/python"
run = "ruff format ."

[tasks."lint:python"]
description = "[Quality] Lint + format-check the Python SDK with ruff"
dir = "sdks/python"
# compileall covers the examples: ruff parses them, but only a compile catches a
# `python examples/…` that would die on the first line. Importing them would be
# the stronger check and needs the native library, which this task does not build
# — the ctypes contract tests in `test:python` are where that is covered.
run = [
    "ruff check .",
    "ruff format --check .",
    "python3 -m compileall -q examples/*.py",
]

[tasks."build:wheel"]
description = "[Build] Build the Python SDK wheel with libreactor_ffi bundled"
dir = "sdks/python"
# Needs a release build of the FFI to bundle; without one hatch_build.py falls back
# to a pure wheel and says so. Override the binary with REACTOR_FFI_LIB, or the
# platform tag with REACTOR_WHEEL_PLATFORM_TAG.
run = [
    "cargo build -p reactor-ffi --release",
    "uv build --wheel --out-dir dist",
]

[tasks."test:python"]
description = "[Testing] Python SDK tests via pytest"
dir = "sdks/python"
# --locked: resolve strictly from the committed uv.lock, matching MISE_LOCKED=1.
# Tests needing the compiled dylib skip themselves when it is absent.
run = "uv run --group dev --locked pytest"

[tasks."test:python:integration-tests"]
description = "[Testing] Python SDK integration tests — real FFI client, real WebRTC, against a live model (needs INTEGRATION_TESTS_REACTOR_API_KEY)"
dir = "sdks/python"
# Deliberately not a dependency of `test` / `test:python`: unlike the unit
# suite's faked `get_lib()`, this connects to a real model in production
# (reactor/echo by default — see integration-tests/conftest.py) over a real
# WebRTC connection, so it needs INTEGRATION_TESTS_REACTOR_API_KEY, costs
# real session time, and runs on the order of minutes rather than seconds.
run = [
    # The unit suite's dylib is optional (tests needing it skip without one);
    # this suite is nothing but live-session calls, so it needs a real build
    # rather than skipping quietly. Same command build:wheel uses, and same
    # reasoning as test:js:integration-tests's explicit sequential steps below.
    "cargo build -p reactor-ffi --release",
    # No --reruns here: retrying a transient failure (the live model's shared
    # session-creation quota, its capacity pool, a session/SDP poll timing
    # out) is scripts/retry.sh's job now, wrapping just this line — not a
    # pytest-specific flag scoped to just one exception type, and not the
    # `cargo build` above it, so a retry never re-pays for a build that
    # already succeeded. $REPO_ROOT, not a relative path: this task's own
    # `dir` above puts its shell in sdks/python, not the repo root.
    # Identically for every SDK — see the sdk-from-ffi skill's
    # "Integration-test retries" section before adding a framework-specific
    # retry back.
    "$REPO_ROOT/scripts/retry.sh uv run --group dev --locked pytest integration-tests/tests -v",
]

[tasks."test:python:endurance-tests"]
description = "[Testing] Python SDK endurance/leak tests — repeated churn against a live model, watching RSS/CPU/handle counts for growth (needs INTEGRATION_TESTS_REACTOR_API_KEY)"
dir = "sdks/python"
# Manual-only: not a dependency of `test`/`test:python`, and not
# wired into ci.yml the way integration-tests is — these are long (minutes to
# hours, via ENDURANCE_DURATION_SECONDS), noisier by nature (a growth trend,
# not a single correctness assertion), and not meant to gate every PR.
# Scheduling this on a cadence is a deliberate follow-up, not done here.
#
# No --reruns here on purpose, unlike test:python:integration-tests: these
# runs can be long, and re-running the whole loop from scratch over one
# transient RateLimitedError would be expensive. paced_connect's own pacing
# (see integration-tests/conftest.py, reused by endurance-tests/conftest.py)
# already keeps session creation well under reactor/echo's quota.
run = [
    "cargo build -p reactor-ffi --release",
    "uv run --group dev --locked pytest endurance-tests/tests -v -s",
]

[tasks.test]
description = "[Testing] Every test suite (Rust + Python + JS + C++ + Swift + Java + Android)"
# test:swift skips itself off a machine with a Swift toolchain rather than
# failing, so this stays runnable on Linux. See the Swift SDK section below.
depends = ["test:rust", "test:python", "test:js", "test:cpp", "test:swift", "test:java", "test:android"]

# ── JS SDK ────────────────────────────────────────────────────────────────────
# Node/npm aren't in [tools] above yet — every task here just shells out to
# whatever `npm` is on PATH (see .github/workflows/ci.yml's `lint`, `wasm` and
# `test` jobs, which use actions/setup-node instead, matching how Rust is
# handled: an action owns the toolchain, mise stays out of its way).

[tasks."install:js"]
description = "[Setup] npm install the JS SDK"
dir = "sdks/js"
run = "npm install"

[tasks."lint:js"]
description = "[Quality] Lint + type-check the JS SDK"
dir = "sdks/js"
depends = ["install:js"]
run = [
    "npm run lint",
    "npm run type-check",
]

[tasks."test:js"]
description = "[Testing] JS SDK unit tests via vitest"
dir = "sdks/js"
depends = ["install:js"]
# Pure-JS unit tests against a mocked ReactorClient — no wasm build needed.
run = "npm run test"

[tasks."build:js"]
description = "[Build] Build the JS SDK to dist/ (needs build:wasm first)"
dir = "sdks/js"
depends = ["install:js"]
run = "npm run build"

[tasks."install:js:integration-tests"]
description = "[Setup] npm install the JS SDK integration test harness"
dir = "sdks/js/integration-tests"
run = "npm install"

[tasks."test:js:integration-tests"]
description = "[Testing] JS SDK integration tests — real browser, real WebRTC, against a live model (needs INTEGRATION_TESTS_REACTOR_API_KEY)"
dir = "sdks/js/integration-tests"
depends = ["install:js:integration-tests"]
# Deliberately not a dependency of `test` / `test:js`: unlike the unit
# suite's mocked client, this connects to a real model in production
# (reactor/echo by default — see harness/vite.config.ts) over a real
# WebRTC connection, so it needs INTEGRATION_TESTS_REACTOR_API_KEY, costs
# real session time, and runs on the order of minutes rather than seconds.
run = [
    # `depends` runs its entries in parallel when they don't depend on each
    # other, and build:js's own copy-wasm step needs build:wasm's
    # crates/reactor-wasm/pkg output to already exist (its description says
    # so, but doesn't declare it as a real dependency) — a race, not a fix,
    # if these two were listed in `depends` instead. Explicit sequential
    # `mise run` steps here, same as every caller in ci.yml/release-js.yml
    # already does by hand, is what actually guarantees the order for the
    # documented local entry point (this task, run on its own from a clean
    # checkout).
    "mise run build:wasm",
    "mise run build:js",
    # This package's tsconfig.json is otherwise never run by anything —
    # Vite/Playwright only transpile, they don't type-check — so a type
    # error here would accumulate silently forever without this.
    "npx tsc --noEmit",
    "npx playwright install --with-deps chromium",
    # scripts/retry.sh wraps only this line, not the build/install steps
    # above it — retrying a transient live-model failure (session-creation
    # rate limit, capacity, an SDP/session poll timing out) should never
    # re-pay for a build that already succeeded. $REPO_ROOT, not a relative
    # path: this task's own `dir` above puts its shell in
    # sdks/js/integration-tests, not the repo root. Identically for every
    # SDK — see the sdk-from-ffi skill's "Integration-test retries" section
    # before adding a Playwright-specific `retries` config back.
    "$REPO_ROOT/scripts/retry.sh npx playwright test",
]

# ── C++ SDK ───────────────────────────────────────────────────────────────────
# Needs a release build of libreactor_ffi to link against; `build:cpp` makes one.
# Rebuild it after pulling changes under crates/ — reactor_abi_version() turns a
# stale library into a message instead of a hang, but only when the library on
# disk is the one you think it is.

[tasks."build:ffi"]
description = "[Build] Build libreactor_ffi in release mode (what the C++ SDK links)"
# Deliberately its own task, and deliberately not a dependency of `build:cpp`.
# On Linux this compiles reactor-webrtc-sys's C++ glue, which needs the pinned
# conda clang++ (see the CI action) — while the SDK itself must be built with the
# platform toolchain, because the conda one brings a sysroot whose glibc cannot
# resolve the symbols the resulting .so needs. Two compilers, two tasks, so
# neither run has to guess which is which.
run = "cargo build -p reactor-ffi --release"

[tasks."build:cpp"]
description = "[Build] Configure + build the C++ SDK and its examples (needs build:ffi first)"
run = [
    "cmake -S sdks/cpp -B sdks/cpp/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "cmake --build sdks/cpp/build",
]

[tasks."fmt:cpp"]
description = "[Format] Format the C++ SDK with clang-format"
# --others so a file that is new and not yet `git add`ed is formatted too. Plain
# `git ls-files` lists only tracked files, which means a new file is unformatted
# and unchecked until it is committed — a false green precisely when a file is
# most likely to need the check. --exclude-standard keeps ignored paths out.
run = "git ls-files --cached --others --exclude-standard 'sdks/cpp/**/*.[ch]pp' | xargs -r clang-format -i"

[tasks."fmt:cpp:check"]
description = "[Format] Check C++ SDK formatting with clang-format"
# Split out of lint:cpp because it needs nothing built and no network, which is
# what makes it usable from the pre-commit hook.
run = "git ls-files --cached --others --exclude-standard 'sdks/cpp/**/*.[ch]pp' | xargs -r clang-format --dry-run --Werror"

[tasks."lint:cpp"]
description = "[Quality] Format-check + clang-tidy the C++ SDK"
# clang-format needs nothing built. clang-tidy needs the compile database, hence
# the depends: it type-checks every translation unit, so it is a compile, not a
# lint over text. Finding a resource directory it can use is fiddly enough to
# live in a script — see scripts/clang-tidy-cpp.sh.
depends = ["build:cpp", "fmt:cpp:check"]
run = """
# tests/package is excluded because clang-tidy is handed this build's compile
# database and that fixture is not in it: it belongs to a separate project,
# configured against the *installed* package by test:cpp:package. Analysed
# without its own flags it parses as neither C++17 nor with an include path,
# which buries the real output under thousands of errors from inside libstdc++.
# A git pathspec glob matches across '/', hence the exclusion rather than a
# narrower pattern.
#
# ':(glob)' on the src pathspec is load-bearing, not decoration: without it,
# git's default pathspec matching does not give '**' its usual "any depth,
# including zero" meaning, so 'src/**/*.cpp' silently matched only .cpp files
# in a *subdirectory* of src/ (audio/, detail/) and skipped every .cpp file
# sitting directly in src/ itself — track.cpp and reactor.cpp among them,
# unlinted for as long as this task has existed. Confirmed with
# `git ls-files` directly: adding ':(glob)' is what makes the direct children
# show up.
git ls-files --cached --others --exclude-standard \
    ':(glob)sdks/cpp/src/**/*.cpp' 'sdks/cpp/tests/*.cpp' ':(exclude)sdks/cpp/tests/package/*' \
  | xargs -r scripts/clang-tidy-cpp.sh sdks/cpp/build
"""

[tasks."test:cpp:package"]
description = "[Testing] Install the C++ package, move it, and build a consumer against it"
# The steps live in a script for the reason clang-tidy's do: `run` is handed to
# /bin/sh, which on a Debian runner is dash and refuses `set -o pipefail`, and a
# gate whose failure mode differs between a laptop and CI is not a gate.
run = "scripts/cpp-package-check.sh"

[tasks."test:cpp"]
description = "[Testing] C++ SDK unit tests via ctest, and the installed package"
# test:cpp:package rides along rather than standing beside this in CI, because
# what CI runs for this binding is `test:cpp` — a guard listed anywhere it does
# not reach is a guard that only holds until someone forgets to run it.
depends = ["build:cpp", "test:cpp:package"]
run = "ctest --test-dir sdks/cpp/build --output-on-failure"

[tasks."test:cpp:integration-tests"]
description = "[Testing] C++ SDK integration tests — real FFI client, real WebRTC, against a live model (needs INTEGRATION_TESTS_REACTOR_API_KEY)"
# Deliberately not a dependency of `test` / `test:cpp`: unlike the unit
# suite's fake Ffi table, this connects to a real model in production
# (reactor/echo by default — see integration-tests/support.cpp) over a real
# WebRTC connection, so it needs INTEGRATION_TESTS_REACTOR_API_KEY, costs real
# session time, and runs on the order of minutes rather than seconds.
#
# A separate build directory (build-integration-tests, not build/), so this
# never shares a CMake cache with the REACTOR_SDK_BUILD_INTEGRATION_TESTS=OFF
# configuration `build:cpp`/`test:cpp` use — reconfiguring build/ with the flag
# flipped on would otherwise silently fold this suite into `ctest --test-dir
# sdks/cpp/build`, the same way test:python:integration-tests deliberately
# stays out of pytest's own default testpaths.
#
# Deliberately does NOT build libreactor_ffi itself — same as `build:cpp`/
# `test:cpp`, and unlike test:python:integration-tests's self-contained
# `cargo build`. On Linux CI, building the FFI (its libwebrtc glue) and
# building this suite need two different compilers — the pinned conda clang++
# and the platform's own, respectively, exactly as ci.yml's `cpp` job's own
# comments explain — so whoever calls this (a CI job, or a contributor
# locally) runs `mise run build:ffi` first, same as the README says.
#
# -DREACTOR_SDK_BUILD_AUDIO=OFF because nothing under integration-tests/
# touches reactor::sdk_audio: building it here would fetch and compile
# miniaudio for no test that ever links it, pure wasted time on every run.
#
# scripts/retry.sh wraps only the final line (the actual test run), not the
# cmake configure/build above it — retrying a transient live-model failure
# should never re-pay for a build that already succeeded. Identically for
# every SDK — see the sdk-from-ffi skill's "Integration-test retries"
# section before adding a framework-specific retry back.
run = [
    "cmake -S sdks/cpp -B sdks/cpp/build-integration-tests -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DREACTOR_SDK_BUILD_TESTS=OFF -DREACTOR_SDK_BUILD_EXAMPLES=OFF -DREACTOR_SDK_BUILD_INTEGRATION_TESTS=ON -DREACTOR_SDK_BUILD_AUDIO=OFF",
    "cmake --build sdks/cpp/build-integration-tests",
    "scripts/retry.sh sdks/cpp/build-integration-tests/integration-tests/reactor_sdk_integration_tests",
]

[tasks."test:cpp:endurance-tests"]
description = "[Testing] C++ SDK endurance/leak tests — repeated churn against a live model, watching RSS/CPU/thread/fd counts for growth (needs INTEGRATION_TESTS_REACTOR_API_KEY)"
# Mirrors test:python:endurance-tests' own reasoning file-for-file (see
# sdks/python/endurance-tests/README.md and this
# suite's own endurance-tests/README.md): long (minutes to hours, via
# ENDURANCE_DURATION_SECONDS), noisier by nature than a correctness
# assertion, and not meant to gate every PR — not a dependency of
# `test`/`test:cpp`, not wired into ci.yml.
#
# A separate build directory (build-endurance-tests), same reasoning as
# test:cpp:integration-tests' own comment on build-integration-tests — never
# shares a CMake cache with build/ or build-integration-tests.
#
# Deliberately does NOT build libreactor_ffi itself — same two-compiler split
# as test:cpp:integration-tests (its own comment explains why): whoever calls
# this runs `mise run build:ffi` first.
run = [
    "cmake -S sdks/cpp -B sdks/cpp/build-endurance-tests -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DREACTOR_SDK_BUILD_TESTS=OFF -DREACTOR_SDK_BUILD_EXAMPLES=OFF -DREACTOR_SDK_BUILD_ENDURANCE_TESTS=ON -DREACTOR_SDK_BUILD_AUDIO=OFF",
    "cmake --build sdks/cpp/build-endurance-tests",
    "sdks/cpp/build-endurance-tests/endurance-tests/reactor_sdk_endurance_tests",
]
# ── Swift SDK ─────────────────────────────────────────────────────────────────
# The manifest is `Package.swift` at the repository root, because SwiftPM will
# not resolve a package that lives in a subdirectory. Everything it points at is
# under sdks/swift/.
#
# All four tasks go through scripts/swift.sh, which answers one question first:
# is there a Swift toolchain here? Off a machine that has one — a Linux
# contributor running `mise run lint` — they skip with a reason instead of
# failing the aggregate. CI runs them on macOS with REACTOR_REQUIRE_SWIFT=1,
# where a missing toolchain is a failure instead.
#
# swift-format comes from the Xcode toolchain rather than from a [tools] pin: it
# is macOS-only, and `lint:mise-lock` requires every declared tool to resolve on
# every lockfile platform. The pin that matters here is the runner's Xcode.

[tasks."fmt:swift"]
description = "[Format] Format the Swift SDK with swift-format"
run = "scripts/swift.sh format"

[tasks."lint:swift"]
description = "[Quality] Lint + format-check the Swift SDK with swift-format"
run = "scripts/swift.sh lint"

[tasks."build:swift"]
description = "[Build] Build the Swift SDK (swift build)"
run = "scripts/swift.sh build"

[tasks."build:swift:ios"]
description = "[Build] Compile the Swift SDK's libraries for iOS (arm64 device)"
# Separate from build:swift, and not a dependency of it: this needs an iPhoneOS
# SDK, which only a machine with full Xcode has. It compiles the library targets
# and links nothing, so it wants no Rust toolchain and no iOS libreactor_ffi.
#
# Its whole reason to exist is that `swift build` on macOS never sees a single
# `#if os(iOS)` branch — and every device the SDK touches on a phone lives in
# one.
run = "scripts/swift.sh build-ios"

[tasks."test:swift"]
description = "[Testing] Swift SDK tests via swift-testing"
run = "scripts/swift.sh test"

[tasks."test:swift:integration-tests"]
description = "[Testing] Swift SDK integration tests (real FFI, real model) on macOS"
run = "scripts/swift.sh integration-tests"

[tasks."test:swift:endurance-tests"]
description = "[Testing] Swift SDK endurance/leak tests — repeated churn against a live model, watching RSS/CPU/thread/fd counts for growth (needs INTEGRATION_TESTS_REACTOR_API_KEY)"
# Mirrors test:python:endurance-tests/test:cpp:endurance-tests' own
# reasoning (see sdks/swift/EnduranceTests/README.md): long (minutes to
# hours, via ENDURANCE_DURATION_SECONDS), noisier by nature than a
# correctness assertion, and not meant to gate every PR — not a
# dependency of `test`/`test:swift`, not wired into ci.yml. macOS only,
# deliberately — no iOS Simulator variant.
run = "scripts/swift.sh endurance-tests"

[tasks."test:swift:integration-tests:ios-simulator"]
description = "[Testing] The same suite, run on an iOS Simulator destination via xcodebuild"
# Only the iOS Simulator slice, not the full XCFramework: this suite only
# ever runs against a Simulator destination (see swift.sh's own comment on
# it), so the macOS and iOS-device slices `build:xcframework` also builds —
# each its own cargo build plus a multi-GB libwebrtc-prebuilt download —
# would be pure waste here. `test:swift:package` still depends on the full
# `build:xcframework` below, since it validates every slice.
depends = ["build:xcframework:ios-simulator-only"]
run = "scripts/swift.sh integration-tests-ios-simulator"

[tasks."build:xcframework"]
description = "[Build] Build ReactorFFI.xcframework (macOS + iOS device + iOS simulator)"
# Four target triples, each downloading its own prebuilt libwebrtc — minutes, and
# about 13 GB of build tree if nothing is pruned. REACTOR_XCFRAMEWORK_PRUNE=1
# keeps only one triple at a time, which is what CI sets and what a 14 GB runner
# needs.
run = "scripts/build-swift-xcframework.sh"

[tasks."build:xcframework:ios-simulator-only"]
description = "[Build] Build ReactorFFI.xcframework with just the iOS Simulator slice"
run = "scripts/build-swift-xcframework.sh ios-simulator-only"

[tasks."test:swift:package"]
description = "[Testing] Consume the XCFramework from a throwaway package, move it, build again"
# The relocation proof. Checking an install tree in place cannot see a baked-in
# absolute path, because on the machine that produced it every such path still
# resolves — the same reason scripts/cpp-package-check.sh exists.
depends = ["build:xcframework"]
run = "scripts/swift-package-check.sh"

# ── Lints ─────────────────────────────────────────────────────────────────────

# ── Java SDK ──────────────────────────────────────────────────────────────────
# The JDK and Gradle come from [tools] above, and there is no Gradle wrapper on
# purpose — sdks/java/settings.gradle.kts says why. Every task passes
# --project-dir rather than cd'ing, so they behave the same from anywhere in the
# repo, and --console=plain so CI logs are readable rather than redrawn.
#
# REACTOR_JDK picks the JDK the build compiles and tests with; it defaults to the
# one mise pins. CI sets it to 22 as well, because 22 is the published floor and
# a floor nobody runs is a claim rather than a fact. Compilation targets release
# 22 whichever JDK is used.

[tasks."fmt:java"]
description = "[Format] Format the Java SDK (palantir-java-format, via Spotless)"
run = "gradle --project-dir sdks/java --console=plain -PreactorJdk={{ env.REACTOR_JDK | default(value='25') }} spotlessApply"

[tasks."lint:java"]
description = "[Quality] Check Java SDK formatting"
# Formatting only. The compiler's own gate — -Xlint:all -Werror, set in
# buildSrc/src/main/kotlin/reactor-java-conventions.gradle.kts — runs as part of
# `test:java`, because it is javac doing it rather than a separate tool.
# apiCheck beside it: the Kotlin facade's public ABI is dumped to a checked-in file, and this is
# what fails when the two disagree. Not reachable through `test:java`, which runs `test` rather
# than `check` — `check` drags the live and endurance suites into the graph.
run = "gradle --project-dir sdks/java --console=plain -PreactorJdk={{ env.REACTOR_JDK | default(value='25') }} spotlessCheck apiCheck"

[tasks."build:java"]
description = "[Build] Build the Java SDK jars"
run = "gradle --project-dir sdks/java --console=plain -PreactorJdk={{ env.REACTOR_JDK | default(value='25') }} assemble"

[tasks."build:java:central-bundle"]
description = "[Build] Stage every published Java coordinate and zip the Maven Central bundle"
# The Portal takes a whole release as one zip, validated and accepted together. Runnable without a
# signing key and without credentials, which is what lets a pull request find an invalid
# publication — a duplicated classifier, a POM missing its licence — before a release does.
run = "gradle --project-dir sdks/java --console=plain -PreactorJdk={{ env.REACTOR_JDK | default(value='25') }} centralBundle"

[tasks."test:java"]
description = "[Testing] Java SDK unit tests"
run = "gradle --project-dir sdks/java --console=plain -PreactorJdk={{ env.REACTOR_JDK | default(value='25') }} test"

[tasks."test:java:integration-tests"]
description = "[Testing] Java SDK integration tests — real FFI, real WebRTC, against a live model (needs INTEGRATION_TESTS_REACTOR_API_KEY)"
# Deliberately not a dependency of `test` / `test:java`: unlike the unit suite's Java-implemented
# fake library, this connects to a real model in production over a real WebRTC connection, so it
# needs a key, costs live sessions, and cannot gate a laptop's build.
#
# Only the test invocation is wrapped in scripts/retry.sh — never the build above it, so a retry
# never re-pays for a build that already succeeded. Wrapped here rather than in each caller's
# workflow step: ci.yml and release-java.yml both run this task, and a wrapper each of them had to
# remember is exactly the drift this avoids. A live model's shared session quota, its capacity
# pool and an SDP poll can all fail transiently without any bug in the binding.
run = [
    "gradle --project-dir sdks/java --console=plain :integration-tests:testClasses",
    "scripts/retry.sh gradle --project-dir sdks/java --console=plain :integration-tests:integrationTest",
]

[tasks."test:java:endurance-tests"]
description = "[Testing] Java SDK endurance tests — long-running leak and resource trends (manual only)"
# Manual-only: not a dependency of `test`/`test:java`, and not wired into ci.yml. This reads a
# trend over minutes to hours rather than a right-or-wrong answer, so it gates nothing — it runs
# from workflow_dispatch and automatically after a real release.
#
# ENDURANCE_DURATION_MINUTES sets the length; ENDURANCE_VERBOSE=1 brings back the per-cycle rows.
run = "gradle --project-dir sdks/java --console=plain :endurance-tests:enduranceTest"

[tasks."example:kotlin"]
description = "[Examples] Run the Kotlin example through the facade"
# Needs REACTOR_API_KEY and a native library, exactly as the Java examples do. One example, not
# eight: the facade forwards to the same code the Java examples already cover.
run = "gradle --project-dir sdks/java --console=plain :examples:exampleKotlin"

[tasks."example:java"]
description = "[Examples] Run one numbered Java example, e.g. `mise run example:java 01`"
# Needs REACTOR_API_KEY, and a native library: `mise run build:ffi` first, or set
# REACTOR_FFI_LIB. REACTOR_SHOW=1 opens a window; REACTOR_SECONDS shortens a run.
run = "gradle --project-dir sdks/java --console=plain -Pexample={{arg(name='number')}} :examples:example"

# ── Android SDK ───────────────────────────────────────────────────────────────
# The JDK, Gradle and the Android command-line tools come from [tools] above, and there is no
# Gradle wrapper on purpose — sdks/android/settings.gradle.kts says why. Every task passes
# --project-dir rather than cd'ing, so they behave the same from anywhere in the repo, and
# --console=plain so CI logs are readable rather than redrawn.
#
# ANDROID_HOME comes from the android-sdk tool, so Gradle finds the SDK with nothing configured.
# The components inside it are pinned in sdks/android/sdk-packages.txt — run `setup:android`
# once, and again whenever that file changes.

[tasks."setup:android"]
description = "[Setup] Install and verify the pinned Android SDK components"
run = "scripts/setup-android-sdk.sh"

[tasks."fmt:android"]
description = "[Format] Format the Android SDK (ktlint, via Spotless)"
run = "gradle --project-dir sdks/android --console=plain spotlessApply"

[tasks."lint:android"]
description = "[Quality] Check Android SDK formatting"
# Formatting only. The Kotlin compiler's own gate — allWarningsAsErrors, set in
# buildSrc/src/main/kotlin/reactor-android-conventions.gradle.kts — runs as part of
# `test:android`, because it is kotlinc doing it rather than a separate tool.
run = "gradle --project-dir sdks/android --console=plain spotlessCheck"

[tasks."build:android:native"]
description = "[Build] Cross-build libreactor_ffi for Android and stage it with the libwebrtc JAR"
# Not a dependency of `build:android`: this compiles the Rust core for an Android target and
# links a prebuilt libwebrtc, which is minutes and gigabytes rather than seconds. The Gradle
# build fails with a pointer back here when the artifacts are absent, which is a better trade
# than making every `assemble` pay for a cross-compile it usually does not need.
run = "scripts/build-android-ffi.sh"

[tasks."build:android"]
description = "[Build] Build the Android SDK AARs"
run = "gradle --project-dir sdks/android --console=plain assemble"

[tasks."setup:android:emulator"]
description = "[Setup] Install the pinned emulator and 16 KB system image for instrumented tests"
# Separate from setup:android because these are well over a gigabyte together, and only the
# instrumented-test job needs them.
run = "scripts/setup-android-sdk.sh --emulator"

[tasks."test:android:asan"]
description = "[Testing] Android JNI bridge lifetime checks under AddressSanitizer (host build)"
# Runs the real bridge against a fake libreactor_ffi, inside a JVM the harness creates, with ASan
# watching. Needs no device and no Android SDK: it is a host build, and it covers the two things
# the on-device suite cannot — a use-after-free that a passing run hides, and reactor_destroy
# returning -1, which a healthy library will never do on request.
run = "scripts/asan-android-jni.sh"

[tasks."test:android:instrumented"]
description = "[Testing] Android SDK instrumented tests — real libraries, on a device or emulator"
# Needs a running device: `mise run setup:android:emulator` first, then an AVD from the pinned
# 16 KB system image. Deliberately not a dependency of `test` / `test:android`, which must stay
# runnable on a laptop and on a Linux runner with no arm64 emulator.
#
# The native artifacts have to be staged first — the AAR under test is the one carrying them.
depends = ["build:android:native"]
run = "gradle --project-dir sdks/android --console=plain :reactor-sdk-android:connectedDebugAndroidTest"

[tasks."test:android"]
description = "[Testing] Android SDK unit tests, and a compile of everything that needs a device"
# Unit tests only — the JVM ones. The instrumented suites need a device or an emulator, so they
# cannot run here.
#
# They are *compiled* here, though, and that is not a nicety. NativeEvents gained two members and
# NativeBoundaryTest — which implements it — went on not compiling for several PRs, because
# nothing anywhere built the androidTest source set. An instrumented test that does not compile is
# an instrumented test that never runs, and it fails at the one moment you are relying on it.
# Compiling costs seconds and needs no device; kotlinc is already this binding's other lint gate.
run = [
  "gradle --project-dir sdks/android --console=plain test",
  "gradle --project-dir sdks/android --console=plain compileDebugAndroidTestKotlin",
]

[tasks."lint:abi"]
description = "[Quality] Verify lib.rs, reactor_ffi.h and _ffi.py declare the same ABI"
run = "python3 scripts/check-abi-parity.py"

[tasks."lint:error-codes"]
description = "[Quality] Verify every SDK declares a class for every error.rs code"
run = "python3 scripts/check-error-codes-parity.py"

[tasks."lint:mise-lock"]
description = "[Quality] Verify mise.lock covers every declared tool + lockfile platform"
run = "python3 scripts/check-mise-lock.py"

[tasks."lint:mise-tools-root"]
description = "[Quality] Enforce a single root [tools] table (no module-declared tools)"
run = "python3 scripts/check-mise-tools-root.py"

[tasks."lint:shell"]
description = "[Quality] Lint shell scripts with shellcheck"
run = "git ls-files '*.sh' | xargs -r shellcheck --shell=bash"

# Scans tracked files' full git history for committed secrets (API keys,
# tokens, private keys, ...). Repo-wide rather than per-binding: a leaked
# credential doesn't care which language it's next to.
[tasks."lint:secrets"]
description = "[Quality] Scan git history for committed secrets"
run = "gitleaks detect --source . --no-banner --redact -v"

[tasks.lint]
description = "[Quality] Run all linters"
depends = [
    "fmt:check",
    "clippy",
    "clippy:wasm",
    "lint:python",
    "lint:js",
    "lint:cpp",
    "lint:swift",
    "lint:java",
    "lint:android",
    "lint:abi",
    "lint:error-codes",
    "lint:shell",
    "lint:secrets",
    "lint:mise-tools-root",
    "lint:mise-lock",
]

[tasks.ci]
description = "[Quality] Everything CI runs"
depends = ["lint", "test"]

# ── Setup ─────────────────────────────────────────────────────────────────────

[tasks.install-hooks]
description = "[Setup] Install git hooks via hk"
run = "hk install --mise"

[tasks.uninstall-hooks]
description = "[Setup] Remove hk-managed git hooks"
run = "hk uninstall"
